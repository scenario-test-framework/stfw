# invokeWeb プラグインのメタデータ。
# k6 バイナリはキャッシュ (または stfw:full の同梱 stfw_plugin_bundled_dir) から
# 絶対パスで起動するため PATH 要求はない
# (プロビジョニングは install、存在ゲートは is_installed が担う)。
# install 時の curl / tar / unzip は install 側で確認する。
# ブラウザモードの実行には Chrome / Chromium が必要 (stfw:full イメージに Chrome を同梱)。
requires: []
# 外部ツールの取得に使う設定キー。プロジェクト共通までの設定だけで決め、プロセスの
# config/config.yml に書いても使わない (雛形にも複製しない。AS-BUILT §4.7)。
provision_keys:
  - k6_version
