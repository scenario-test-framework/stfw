name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  # 呼び出し経路のある脆弱性 (依存・Go 本体) があれば失敗する。
  # Go 本体は go.mod の toolchain (= 配布バイナリのビルドに使う版) で判定される
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # 脆弱性スキャンの除外リスト (.trivyignore.yaml) が決まりを守っていること、
  # その検査スクリプトにすり抜けが無いことを見本の入力で確かめる (AS-BUILT §10.4)
  scan-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/test-check-trivyignore.sh
