name: scheduled-scan

# 週 1 回の定期チェック (AS-BUILT §10.4)。master に変更が無い間に出た修正版
# (Debian のパッケージ・Go 本体と依存・同梱ツールの新しい版) を取り込み漏れとして知らせる。
# 見つかったらジョブを失敗させ、GitHub の通知で知らせる (リリースは止めない)。
# schedule は既定ブランチの最新コミットで UTC で動く。毎正時は混雑で遅延・取りこぼしがあるため 17 分にずらす。
# 公開リポジトリは 60 日間活動が無いと schedule が自動で無効になる。
on:
  schedule:
    - cron: "17 0 * * 1" # 毎週月曜 00:17 UTC (09:17 JST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # キャッシュを使わず、ベースイメージも取り直して作る (Debian の新しい修正版を取り込むため)
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          pull: true
          no-cache: true
          load: true
          tags: stfw-scan:runtime
      - id: build-full
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          push: false
          pull: true
          no-cache: true
          load: true
          tags: stfw-scan:full
      # 合否は master の CI (build.yml) と同じ基準
      - name: Scan images with Trivy
        run: bash .github/scripts/scan-images.sh stfw-scan:runtime stfw-scan:full
      # 除外リストのうち、もう見つからなくなった行 (対応版を取り込んだ後の消し忘れ) を警告する。
      # 警告の注記を出すだけで、定期チェックを失敗させない
      - name: Warn about stale entries in .trivyignore.yaml
        if: always() && steps.build-full.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/check-trivyignore-stale.sh stfw-scan:runtime stfw-scan:full

  bundled-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 同梱ツールの既定版が最新リリースか (新しい版が出ていれば失敗)
      - name: Check bundled tool versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-bundled-versions.sh

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # PR の後に公表された、Go 本体 (toolchain) と依存の脆弱性を拾う
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
