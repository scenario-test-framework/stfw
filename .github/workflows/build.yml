name: build

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-dist
          path: dist/*.tar.gz
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: stfw-scan:runtime
      # 全組込みプラグインのランタイム同梱版もビルド検証する
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          push: false
          load: true
          tags: stfw:full-ci
      # 同梱した外部ツール (compare-files / k6 / logfilter) がプラグインから解決できること
      # (install スクリプトの配置先と同梱レイアウトの結合を守る)。ネットワーク遮断下で
      # init し、DL を要するプラグインの install がインストール済み (exit 3) になることを確認する。
      - name: smoke test bundled plugin tools
        run: |
          mkdir -p "${RUNNER_TEMP}/proj" && chmod 777 "${RUNNER_TEMP}/proj"
          docker run --rm --network none -v "${RUNNER_TEMP}/proj:/work" stfw:full-ci init
          for t in compare invokeRest invokeWeb collectLog; do
            rc=0
            docker run --rm --network none -v "${RUNNER_TEMP}/proj:/work" stfw:full-ci plugin install "${t}" || rc=$?
            if [ "${rc}" -ne 3 ]; then
              echo "::error::stfw plugin install ${t} exited ${rc} (want 3 = bundled)"
              exit 1
            fi
          done
      # 脆弱性スキャン: 修正版のある脆弱性があれば深刻度に関係なく失敗させる。対応版待ちのものだけ
      # 除外リスト (.trivyignore.yaml。場所・期限・理由つき) で外す。修正版の無いもの (Debian 側で未提供など) は
      # 直せないため合否に含めない。判定は scan-images.sh に集約し、
      # 週 1 回の定期チェック (scheduled-scan.yml) と共有する。
      # trivy-action は 2026-03 にタグ乗っ取りの前例があるため使わず、公式イメージを digest 固定で実行する
      - name: Scan images with Trivy
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: bash .github/scripts/scan-images.sh stfw-scan:runtime stfw:full-ci
