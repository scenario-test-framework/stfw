meta:
  event_id: "20261125_052806_reflect_ci_vuln_scan"
  trigger_event: "rdra:20261125_052806_reflect_ci_vuln_scan, nfr:20261125_052806_reflect_ci_vuln_scan"
  created_at: "2026-11-25T05:28:06"

system_architecture:
  tiers:
    - id: "tier-distribution"
      name: "配布・CI"
      description: "フレームワーク自体の品質保証と配布を担う開発時ティア。CI/CD で PR と master の検証、週次・手動の取り込み漏れ確認、マルチプラットフォームバイナリ・検証済みコンテナイメージ・compose 定義の配布を扱う。"
      technology_candidates:
        - "バイナリリリースホスティング"
        - "Container Registry"
        - "CI/CD パイプライン"
        - "リリース自動化ツール（クロスコンパイル + チェンジログ生成）"
      policies:
        - id: "SP-401"
          name: "マルチプラットフォーム単一バイナリ配布"
          description: "環境管理者は配布元（GitHub Releases / ghcr.io）から対象プラットフォームのバイナリ（linux/darwin × amd64/arm64 + windows/amd64）または Docker image / compose.yaml を取得し、配置のみで導入を完了する。install スクリプトと依存モジュールのダウンロードは廃止"
          reason: "NFR F.1.1.1 対応 OS(Lv3) / D.2.1.1 移行方式への対応。tar.gz 展開 + 依存準備だった導入を配布物の配置のみに短縮する"
          source_model: "情報: stfw 本体, 外部システム: 配布元（GitHub Releases / ghcr.io）, バリエーション: 対応 OS 種別, アクター: 環境管理者, BUC: stfw導入フロー, NFR F.1.1.1, NFR D.2.1.1"
          confidence: "user"
        - id: "SP-402"
          name: "依存全部入りコンテナイメージタグの提供"
          description: "Docker image は既存の最小構成に加えて、プラグインのランタイム依存（k6・RDB クライアント・ssh / scp 等）全部入りのタグ（例: stfw:full）を提供する"
          reason: "依存準備なしで組込みプラグイン群を利用可能にし、導入の摩擦を下げるため"
          source_model: "バリエーション: Docker イメージ構成, 情報: stfw 本体"
          confidence: "medium"
        - id: "SP-403"
          name: "パッチ適用はバイナリ差し替え"
          description: "バージョン更新・パッチ適用はバイナリ / イメージの差し替えで任意時点に行い、計画停止の概念を持たない"
          reason: "NFR C.2.1.2 パッチ適用方針 / A.1.1.3 計画停止(Lv1) への対応。常駐サービスが無いため停止調整が不要"
          source_model: "NFR C.2.1.2, NFR A.1.1.3"
          confidence: "medium"
      rules:
        - id: "SR-401"
          name: "CI 品質ゲート"
          description: "開発 CI 基盤（GitHub Actions）で PR ごとに lint + test（単体テスト + testscript 受け入れテスト）、master マージで snapshot ビルド、tag 付与でリリースとコンテナイメージ配布を実行する"
          reason: "NFR C.4.1.1 テスト環境(Lv2) / E.2.1.1 リスク分析への対応。フレームワーク自体の品質保証を自動化するため"
          source_model: "外部システム: 開発 CI 基盤（GitHub Actions）, NFR C.4.1.1, NFR E.2.1.1"
          confidence: "user"
        - id: "SR-402"
          name: "配布物の整合性検証"
          description: "GoReleaser のリリース成果物は取得側がチェックサムで検証できる。Docker イメージは release.yml で runtime・full を amd64・arm64 ごとにローカルにロードし、smoke-image.sh で確認する。同じビルダーのキャッシュで再ビルドした公開用イメージをタグなしで ghcr.io に push し、verify-pushed-image.sh で確認済みイメージとレイヤーの diff_id の並びを照合する。両 arch の確認成功後、docker-publish が runtime・full の manifest を dry-run してから配布用タグを順に付ける。"
          reason: "NFR C.4.1.1 テスト環境(Lv2)、E.9.1.1 マルウェア対策、E.1.1.1 セキュリティポリシーへの対応。動的に更新される Wolfi パッケージを含め、スモークテスト済みのレイヤーを利用者に届ける（AS-BUILT §10.2・§10.4）。"
          source_model: "外部システム: 配布元（GitHub Releases / ghcr.io）, 外部システム: 開発 CI 基盤（GitHub Actions）, NFR C.4.1.1, NFR E.9.1.1, NFR E.1.1.1"
          confidence: "high"
        - id: "SR-403"
          name: "OSS コミュニティサポート"
          description: "サポートはリポジトリの issue ベース（ベストエフォート）とし、SLA を伴うサポート窓口は設けない"
          reason: "NFR C.5.1.1 サポート時間(Lv1・ユーザー確定) への対応。OSS フレームワークとしての標準的な体制"
          source_model: "NFR C.5.1.1"
          confidence: "medium"
        - id: "SR-404"
          name: "PR・master の脆弱性検査とイメージの部品確認"
          description: "SR-401 の CI 品質ゲートを補完する。PR では lint・Go のビルドとテストに加え、govulncheck と実ファイルを含む .trivyignore.yaml の検査の見本テストを行う。master への push では runtime・full を amd64・arm64 でビルドし、ネットワークなしでスモークテストする。full では DB クライアントや MySQL 認証部品、日本語フォント、compare_files・compare_regex、同梱 Chrome を使う k6 ブラウザの DOM 操作も検証する。amd64 では full の同梱ツールの解決を確認し、digest 固定の Trivy で runtime・full の OS・ライブラリを検査する。修正版がある検出は深刻度を問わず失敗とし、修正版がない指摘と有効な除外は合否の対象外とする。対応版待ちは対象パス、明日以降かつ UTC で今日から 60 日以内の期限、理由付きで除外し、除外された指摘も結果に表示する。除外リストの形式違反や期限切れは検査を失敗させる。"
          reason: "NFR C.4.1.1 テスト環境(Lv2)、C.4.2.1 開発環境(Lv1)、E.3.1.1 セキュリティ診断(Lv1) への対応。依存とイメージの部品を継続して検証する（AS-BUILT §10.2・§10.4）。"
          source_model: "外部システム: 開発 CI 基盤（GitHub Actions）, NFR C.4.1.1, NFR C.4.2.1, NFR E.3.1.1, NFR E.4.1.1"
          confidence: "high"
        - id: "SR-405"
          name: "修正版の取り込み漏れの定期チェック"
          description: "SR-401 の CI 品質ゲートを補完するため、scheduled-scan.yml を毎週月曜 00:17 UTC と手動で実行する。amd64 の runtime・full をキャッシュなしで再ビルドし、master と同じスモークテストと Trivy 基準を適用する。該当する指摘が両イメージから消えた除外は警告する。k6・compare-files・logfilter の既定版を最新リリースと、Dockerfile の Chrome と公開済み :full の両 arch の Chrome を Chrome for Testing の Stable と照合する。公開イメージからは版のファイルを取り出して比較する。Go 本体と依存は govulncheck で調べる。取り込み漏れを検出したジョブは失敗し、保守担当者が修正 PR または期限・理由付きの除外 PR で対応する。Wolfi パッケージの修正版は次のリリースの再ビルドで取り込む。定期チェックの失敗通知は、cron を最後に変更した、または無効化後に再度有効にしたユーザーが GitHub Actions の Web またはメール通知を有効にしている場合に届き、公開リポジトリで 60 日間活動がないと schedule が通知なしで自動停止するため、停止時は gh workflow enable scheduled-scan.yml で再有効化する。"
          reason: "NFR C.2.1.2 パッチ適用方針(Lv1)、E.3.1.1 セキュリティ診断(Lv1)、E.4.1.1 リスク管理への対応。コミット間に公表された修正版を検知し、Trivy の検出対象外の Chrome は版の照合で補う（AS-BUILT §10.2・§10.4）。"
          source_model: "外部システム: 開発 CI 基盤（GitHub Actions）, 外部システム: 配布元（GitHub Releases / ghcr.io）, NFR C.2.1.2, NFR E.3.1.1, NFR E.4.1.1"
          confidence: "high"
  cross_tier_policies:
    - id: "CTP-008"
      name: "セキュリティ運用の責務分担"
      description: "フレームワーク側は暗号化保管・マスキング・known_hosts 検証・依存最小化を提供し、開発 CI で静的解析、Go 本体・依存と配布イメージの脆弱性診断、期限付きの例外管理を行う。利用先環境のセキュリティポリシー策定・診断・インシデント対応は利用組織が担う。"
      reason: "NFR E.1.1.1 セキュリティポリシー(Lv1)、E.2.1.1 リスク分析(Lv1)、E.3.1.1 診断(Lv1)、E.4.1.1 リスク管理(Lv1)、E.11.1.1 インシデント対応(Lv1) への対応。配布物の保守と個々の導入先の運用の責任範囲を明確にする。"
      source_model: "外部システム: 開発 CI 基盤（GitHub Actions）, NFR E.1.1.1, NFR E.2.1.1, NFR E.3.1.1, NFR E.4.1.1, NFR E.11.1.1"
      confidence: "medium"
