source: ".tmp/change-request-pending-reflect.txt（実装の正本: docs/AS-BUILT.md §3.4・§4.8・§4.11.1・§5.1〜§5.2・§5.5〜§5.8・§10.2）"
system_name: "stfw"

requirements:
  - id: "REQ-003"
    event_id: "20261125_050658_reflect_run_workspace_resume_bundled_tools"
    created_at: "2026-11-25T05:06:58"
    requirement: "テスト実行者が、ディレクトリ構造で記述したシナリオテスト（複数シナリオ）を Go 単一バイナリに内蔵された逐次実行ランナーで一括自動実行でき、実行順序の保証とエラー時停止が担保される"
    reason: "ディレクトリ構造どおりのワークフロー自動実行がフレームワークの中核目的であることは変わらない。v1.0 では外部ワークフローエンジン digdag を廃止して実行エンジンを内包したことで、server 起動などの前準備なしに 1 コマンドで実行でき、実行順序保証・エラー時停止・Blocked 伝播は内蔵ランナーが同一仕様で提供するため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "stfw run <scenario-names...> は validate 相当の静的検証（対象シナリオの存在チェック等を含む）を通過後、run_id（_{YYYYMMDDHHMMSS}_{PID}、採番規則は SPEC-003-04）を採番し、実行ワークスペース（REQ-029）を用意して内蔵ランナーで実行を開始する。digdag プロジェクトの push・attempt_id・「digdag server が起動中であること」の前提条件は廃止し、旧 server start → run -f の 2 段階を 1 コマンドに統合する"
        acceptance_criteria:
          - "Given シナリオ存在 When stfw run を実行する Then 前準備コマンドなしに run_id が採番され実行が開始される"
          - "Given 対象シナリオが存在しない When stfw run を実行する Then run 開始前の静的検証でエラー終了する"
          - "Given v1.0 の stfw When 実行コンテキストを確認する Then attempt_id は存在せず run_id で実行が識別される"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "information"
            action: "modify"
            target: "実行コンテキスト"
          - type: "condition"
            action: "modify"
            target: "run 実行の前提条件"
          - type: "condition"
            action: "delete"
            target: "run_id / attempt_id の採番・保持"
          - type: "condition"
            action: "add"
            target: "run_id の採番・保持"
          - type: "external_system"
            action: "delete"
            target: "digdag"
      - id: "SPEC-003-02"
        specification: "改訂: 内蔵ランナーが run / scenario / bizdate 各階層の setup / teardown を直接実行し（digdag からの呼び戻しは廃止）、実行ジャーナルへ開始・終了イベントを記録して階層実行ステータス（Started → Success / Warn / Error）を確定させる（Warn の集約規則は REQ-023 / SPEC-023-02 を参照）"
        acceptance_criteria:
          - "Given シナリオ実行中 When 全タスクが正常終了する Then 各階層の teardown で階層実行ステータスが Success になる"
          - "Given シナリオ実行中 When タスクがエラー終了する Then 該当階層の階層実行ステータスが Error になる"
        affected_models:
          - type: "state"
            action: "modify"
            target: "階層実行ステータス"
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "external_system"
            action: "delete"
            target: "digdag"
      - id: "SPEC-003-03"
        specification: "改訂: プロセスを setup → pre_execute → execute → post_execute → teardown の順で実行し、scripts プラグインでは scripts/ 配下をファイル名昇順に逐次実行する。エラー発生時は後続スクリプトを実行せず Blocked として記録しエラー終了する。exit 3 は Warn として記録して続行する（ステップ実行ステータス: Pending → Success / Warn / Error / Blocked。Warn の実行意味論は REQ-023 / SPEC-023-01 を参照）。これらを内蔵ランナーが提供する"
        acceptance_criteria:
          - "Given 3 つのスクリプトを昇順配置 When 2 番目がエラー終了する Then 3 番目は実行されず Blocked と記録されプロセスは Error になる"
          - "Given 全スクリプトが正常終了 When プロセスを実行する Then 全ステップが Success となりプロセスは Success になる"
        affected_models:
          - type: "state"
            action: "modify"
            target: "ステップ実行ステータス"
          - type: "condition"
            action: "modify"
            target: "逐次実行・エラー時 Blocked"
          - type: "external_system"
            action: "delete"
            target: "digdag"
      - id: "SPEC-003-04"
        specification: "run_id は秒単位の採番時刻とプロセス ID から _{YYYYMMDDHHMMSS}_{PID} 形式で生成する。通常は現在時刻を用いる。最新 run の採番時刻が現在時刻以上で差が 24 時間以内なら最新の採番時刻に 1 秒を加え、最新 run が 24 時間を超えて未来なら現在時刻を用いる。この場合、新しい run は採番順でその未来の run より古くなる。同時に採番した run は同じ採番時刻になり得る。既存 run_id と衝突したら時刻を 1 秒ずつ進めて最大 10 回まで再採番する。run_id 形式のディレクトリは採番時刻、同時刻なら pid の数値で昇順に並べる。この順序を status / report の最新 run、HTML レポート一覧、--resume の最新の完了済み run の選択に用いる（AS-BUILT §5.1〜§5.2・§5.5）"
        acceptance_criteria:
          - "Given 最新 run の採番時刻が現在時刻と同じ、または 24 時間以内の未来 When 新しい run を採番する Then 最新 run の採番時刻に 1 秒を加えた時刻を使う"
          - "Given 最新 run の採番時刻が 24 時間を超えて未来 When 新しい run を採番する Then 現在時刻を使い、採番順では新しい run がその未来の run より前に並ぶ"
          - "Given 並走 run が同じ採番時刻で異なる pid を持つ When run を並べる Then pid 9 は pid 10 より前になり、引数省略時の status / report は並びの末尾を、--resume は完了済みの中の末尾を選ぶ"
          - "Given 採番した run_id のディレクトリが既に存在する When 新規作成を試みる Then 採番時刻を 1 秒ずつ進めて最大 10 回まで再採番する"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "run_id の採番・保持"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "buc"
            action: "modify"
            target: "実行結果監視・確認フロー"
          - type: "information"
            action: "modify"
            target: "HTML レポート"

  - id: "REQ-006"
    event_id: "20261125_050658_reflect_run_workspace_resume_bundled_tools"
    created_at: "2026-11-25T05:06:58"
    requirement: "改訂: テスト結果確認者が、実行ジャーナルをソースとする stfw status / stfw report（静的 HTML レポート）と stderr への構造化ログにより実行状況と結果を確認し、失敗時の調査ができる"
    reason: "digdag 廃止により Web UI・ログ追従（run -f）による確認手段が消滅したため、実行結果の唯一のソースである実行ジャーナル（journal.jsonl）のリプレイに基づく確認手段（status / report）へ置換する。進捗把握と障害調査ができることは従来どおり必要である。改訂: ファイルログ（.stfw/stfw.log への集約・日次ローテーション・terminal 実行時のカラー出力）の要求はプロダクトオーナーの決定により撤回する（実装しない）。stderr への構造化ログ（slog + シークレットマスキング）と、HTML レポート・OTLP トレースによる実行状況の可視化で運用要求を満たすと判断した"
    priority: "should"
    specifications:
      - id: "SPEC-006-01"
        specification: "実行結果の唯一のソースは実行ジャーナル（.stfw/runs/{run_id}/journal.jsonl。追記専用 JSONL、node_start / steps_enumerated / step_end / node_end イベント）とする。OTel トレース（REQ-009）もジャーナルイベントの投影である"
        acceptance_criteria:
          - "Given シナリオ実行完了 When .stfw/runs/{run_id}/journal.jsonl を参照する Then 全階層・ステップの開始・終了イベントが追記専用 JSONL として記録されている"
        affected_models:
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "information"
            action: "modify"
            target: "OTel トレース（スパンツリー）"
      - id: "SPEC-006-02"
        specification: "stfw status [run_id] で実行ジャーナルをリプレイし、階層ツリー + ステータスを表示する。digdag Web UI・ログ追従（run -f）・attempt URL 案内による確認は廃止する。run_id 省略時は採番時刻 → pid の数値の順で最新の run を選ぶ（SPEC-003-04）"
        acceptance_criteria:
          - "Given シナリオ実行中または実行完了 When stfw status を実行する Then 階層ツリーと各階層・ステップのステータスが表示される"
          - "Given v1.0 の stfw When run コマンドのオプションを確認する Then ログ追従オプション（-f / --follow）は存在しない"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "実行結果監視・確認フロー"
          - type: "actor"
            action: "modify"
            target: "テスト結果確認者"
          - type: "information"
            action: "delete"
            target: "digdag 管理情報"
          - type: "external_system"
            action: "delete"
            target: "digdag"
      - id: "SPEC-006-03"
        specification: "stfw report [run_id] で静的 HTML レポート（.stfw/reports/ に index + run 詳細）を生成する。実行中も process 終了ごとに増分再生成され、準リアルタイムに閲覧できる。Docker Compose 構成では nginx サービスが reports 共有 volume を配信し、ブラウザ（http://localhost:8080）でレポートを閲覧できる。run_id 省略時の対象とレポート一覧は SPEC-003-04 の run 順序に従う。並走 run 間で index.html は共有する。原子的に書き込んだスナップショットの後勝ちとなり、完了済みの run が Started のまま載ることがある。次の stfw run / stfw report の再生成で解消する（AS-BUILT §5.5・§5.7）"
        acceptance_criteria:
          - "Given シナリオ実行完了 When stfw report を実行する Then .stfw/reports/ に index と run 詳細の静的 HTML が生成される"
          - "Given シナリオ実行中 When process が終了する Then レポートが増分再生成され準リアルタイムに閲覧できる"
          - "Given Docker Compose 構成で起動済み When ブラウザで http://localhost:8080 を開く Then nginx が配信するレポートを閲覧できる"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "実行結果監視・確認フロー"
          - type: "information"
            action: "add"
            target: "HTML レポート"
          - type: "information"
            action: "modify"
            target: "HTML レポート"
      - id: "SPEC-006-04"
        specification: "改訂: ログは stderr への構造化ログ出力とし、ログレベル（trace / debug / info / warn / error）の設定・変更と、環境変数 PASSWORD / TOKEN 値の [secret] マスキングを維持する。ファイルログの要求（.stfw/stfw.log への集約・日次ローテーション・terminal 実行時のカラー出力（ファイルはプレーン））は撤回する（実装しない）。実行状況の可視化は HTML レポート（SPEC-006-03）と OTLP トレース（REQ-009）が担う"
        acceptance_criteria:
          - "Given PASSWORD 環境変数を含む処理 When ログへ出力される Then 値が [secret] に置換されている"
          - "Given loglevel を debug に設定 When コマンドを実行する Then debug レベルのログが stderr へ出力される"
          - "Given 任意のコマンド実行 When ログ出力先を確認する Then ログファイル（.stfw/stfw.log）は生成されず、ログは stderr への構造化ログとして出力される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "実行ログ"
          - type: "condition"
            action: "modify"
            target: "シークレットマスキング"
          - type: "buc"
            action: "modify"
            target: "実行結果監視・確認フロー"

  - id: "REQ-016"
    event_id: "20261125_050658_reflect_run_workspace_resume_bundled_tools"
    created_at: "2026-11-25T05:06:58"
    requirement: "シナリオ作成者・環境管理者が、組み込みプラグイン群を既存の接続情報管理（inventory / secret / ssh trust）と統一された互換境界（ディレクトリ規約・プラグイン env 契約・エビデンスディレクトリ規約）のもとで安全に利用でき、プラグインのランタイム依存を実行前に検出できる"
    reason: "プラグインごとに接続情報の持ち方・出力構造・依存の準備方法がばらつくと、設定の重複・平文資格情報の混入・実行時になって判明する依存不足を招く。横断規約として統一することで、組み込みプラグインとカスタムプラグインの 2 層構造によるエコシステム全体の互換性と安全性を担保するため"
    priority: "must"
    specifications:
      - id: "SPEC-016-01"
        specification: "収集先・接続先ホストは既存の inventory（ホストグループ）を参照し、資格情報は secret（age 暗号化）、SSH ホストキーは ssh trust を利用する。プラグイン設定は config.yml の stfw.process.{type} 配下に置き、既存の env フラット化規則で全スクリプトへ環境変数として公開される。設定スキーマは、収集系プラグインが targets リスト（group: inventory グループ名参照、paths: 収集ファイルパス正規表現リスト）、データストア系プラグインが host_group（inventory グループ名参照）・port・database・user・tables（テーブル名リスト）等とする。データストア系のパスワードは secret の {host}-{user} を自動参照する。接続情報（ホスト・パスワード）を config.yml に直接書くことは禁止する"
        acceptance_criteria:
          - "Given 組み込みプラグインの設定（config.yml） When 収集先・接続先を指定する Then 収集系は targets（group / paths）、データストア系は host_group 等の inventory グループ名参照のみで指定でき、ホスト名・資格情報は直接記述しない"
          - "Given stfw.process.{type} 配下のプラグイン設定 When プロセスを実行する Then 既存の env フラット化規則で全スクリプトへ環境変数として公開される"
          - "Given データストア系プラグインの接続 When 資格情報を利用する Then secret（age 暗号化）の {host}-{user} が自動参照され、SSH 接続では ssh trust（known_hosts）の既存機構が利用される"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "プラグイン接続情報のグループ名参照"
          - type: "information"
            action: "modify"
            target: "インベントリ"
          - type: "information"
            action: "modify"
            target: "パスワード"
          - type: "information"
            action: "modify"
            target: "SSH サーバキー（known_hosts）"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "buc"
            action: "modify"
            target: "接続情報管理フロー"
      - id: "SPEC-016-02"
        specification: "エビデンスディレクトリ規約を定める。収集系プラグイン（collectFile / collectLog / exportXxx）の出力ルートは自プロセスディレクトリ配下の evidence/（gitignore 対象）とし、collectFile / collectLog は evidence/{host}/{収集元の絶対パスをそのまま再現}、exportMysql / exportPostgres は evidence/{database}/{table}.csv、exportRedis は evidence/{host}/{keyパターン名}.csv へ出力する。compare プラグインのディレクトリは、expect/（git 管理。直下に同一 bizdate 内の収集系 process ディレクトリ名を置き、その配下は当該 process の evidence/ 配下と同型）、actual/（gitignore・自動生成。expect と同じ構造で実体は各収集系 process の evidence/ への symlink）、result/（gitignore。compare-files の比較結果出力）とする。本規約はディレクトリ規約・プラグイン env 契約に次ぐ第 3 の互換境界として文書化する。実行で生成される evidence/・actual/・result/ の実体は run ワークスペース内のプロセスディレクトリに置く（REQ-029）"
        acceptance_criteria:
          - "Given 収集系プラグインの出力 When 出力先を確認する Then 自プロセスディレクトリ配下の evidence/（gitignore 対象）に、collectFile / collectLog は {host}/{収集元の絶対パス}、exportMysql / exportPostgres は {database}/{table}.csv、exportRedis は {host}/{keyパターン名}.csv として配置される"
          - "Given compare の expect/ ディレクトリ When 構造を確認する Then 直下に同一 bizdate 内の収集系 process ディレクトリ名が置かれ、その配下は当該 process の evidence/ 配下と同型である"
          - "Given エビデンスディレクトリ規約 When 互換境界の位置づけを確認する Then ディレクトリ規約・プラグイン env 契約に次ぐ第 3 の互換境界として文書化されている"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "エビデンスディレクトリ規約"
          - type: "information"
            action: "modify"
            target: "エビデンス"
          - type: "information"
            action: "modify"
            target: "期待値（expect）"
          - type: "information"
            action: "modify"
            target: "比較結果"
      - id: "SPEC-016-03"
        specification: "プラグインはメタデータファイル plugin.yml に requires（前提コマンドのリスト。例: mysql, scp）をランタイム依存として宣言する。stfw validate と run 前静的検証が、シナリオで使用するプロセスタイプの requires をコマンド存在チェックで検証する。Docker イメージは既存の最小構成に加えて依存全部入りのタグ（例: stfw:full）を提供する。同梱の k6 / compare-files / logfilter は各プラグインの外部ツール解決規則（REQ-031）で利用する"
        acceptance_criteria:
          - "Given plugin.yml に requires を宣言したプラグインを使うシナリオ When stfw validate または stfw run を実行する Then シナリオで使用するプロセスタイプの requires がコマンド存在チェックで検証され、不足があれば検出される"
          - "Given Docker 配布物 When イメージタグを確認する Then 既存の最小構成に加えて依存全部入りのタグ（例: stfw:full）が提供されている"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "プラグインのランタイム依存宣言と存在チェック"
          - type: "condition"
            action: "modify"
            target: "run 前静的検証"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "information"
            action: "modify"
            target: "stfw 本体"
          - type: "buc"
            action: "modify"
            target: "シナリオ静的検証フロー"
          - type: "external_system"
            action: "modify"
            target: "配布元（GitHub Releases / ghcr.io）"
          - type: "variation"
            action: "modify"
            target: "Docker イメージ構成"

  - id: "REQ-019"
    event_id: "20261125_050658_reflect_run_workspace_resume_bundled_tools"
    created_at: "2026-11-25T05:06:58"
    requirement: "テスト実行者が、stfw run の開始時に、保存期間を過ぎた過去の実行結果（実行ジャーナル、実行ワークスペースとその生成物、HTML レポート）を自動削除でき、継続利用でストレージが逼迫するのを防げる"
    reason: "run ごとに実行ディレクトリ（ジャーナル・ワークスペース内のエビデンス等）と HTML レポートが累積する。run の開始時にハウスキープを実行すれば、専用サブコマンドや常駐ジョブを使わずに保存期間を維持できる"
    priority: "should"
    specifications:
      - id: "SPEC-019-01"
