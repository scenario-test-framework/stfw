          - type: "condition"
            action: "modify"
            target: "run 実行の前提条件"
          - type: "condition"
            action: "modify"
            target: "run 前静的検証"
          - type: "condition"
            action: "modify"
            target: "実行結果ハウスキープ"
      - id: "SPEC-025-04"
        specification: "部分実行のスキップ意味論を定める。スキップされたノードは実行されず、実行ジャーナルへ一切記録されない（node_start / node_end もフックも無い）。実行されるノードの祖先階層のフック（run / scenario / 実行対象を含む bizdate の setup・teardown）は通常どおり実行する。実行ジャーナルの run node_start の attrs に、部分実行時のみ from / only（指定パス）を記録する。スキップしたノードの副作用（データ投入等）の再現はユーザー責務とし、ツールは前提を再現しない。部分実行も新しい実行ワークスペースを使う。過去 run の生成物を利用する場合は --resume（REQ-030）を併用し、省略して compare を実行する場合は必要な収集プロセスを実行対象に含める（AS-BUILT §3.4）"
        acceptance_criteria:
          - "Given --from で途中の bizdate_dir を指定して実行完了 When 実行ジャーナルを参照する Then スキップされたノードの node_start / node_end およびフックのイベントは一切記録されていない"
          - "Given 部分実行で実行完了 When 実行ジャーナルを参照する Then 実行されたノードの祖先階層のフック（run / scenario / 実行対象を含む bizdate の setup・teardown）は通常どおり実行・記録されている"
          - "Given 部分実行で実行完了 When 実行ジャーナルの run node_start を参照する Then attrs に from / only（指定パス）が記録されている"
          - "Given 部分実行の指定なしで実行完了 When 実行ジャーナルの run node_start を参照する Then attrs に from / only は記録されていない"
          - "Given スキップ対象にデータ投入等の副作用を持つ process が含まれる When 部分実行する Then ツールはスキップした process の副作用を再現しない（前提の再現はユーザー責務）"
          - "Given 前 run に compare が必要とする evidence/ が存在 When --resume なしで compare だけを部分実行する Then 過去 run の evidence/ は参照されず、依存する収集処理を今回の実行対象に含める必要がある"
