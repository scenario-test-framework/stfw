system_name: "stfw"

requirements:
  - id: "REQ-002"
    event_id: "20261125_092817_reflect_v190_plugin_contracts"
    created_at: "2026-11-25T09:28:17"
    requirement: "シナリオ作成者が、業務日付（bizdate）をまたぐ一連の業務処理を scenario > bizdate > process の 3 階層ディレクトリ構造とスクリプトとして記述し、静的検証（stfw validate）で実行可能性を事前確認できる"
    reason: "業務日付の進行を伴うバッチ処理系業務システムのシナリオテストでは、日付単位でテストを区切って進行させる必要がある。v1.0 ではワークフロー定義（dig）の生成・管理が不要になり、記述したディレクトリ構造そのものが実行定義となるため、検証は静的検証コマンドに分離した"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "scaffold 生成コマンドを stfw new scenario / stfw new bizdate / stfw new process に刷新する（旧 scenario -i / bizdate -i / process -i）。3 階層の scaffold（ディレクトリ・metadata.yml・config・scripts 雛形）生成と、bizdate は YYYYMMDD の 8 桁数字・seq は数値のみ・group は「_」を含まないことの検証は同一仕様で維持する。stfw new process でプラグインに template/ が無く、既定 config.yml を config/config.yml として複製する場合は、plugin.yml の provision_keys に宣言したキーを除く（SPEC-016-04、AS-BUILT §2.3・§4.7）"
        acceptance_criteria:
          - "Given プロジェクト初期化済み When stfw new scenario / new bizdate / new process を順に実行する Then scenario/{name}/_{seq}_{bizdate}/_{seq}_{group}_{type}/ の階層が生成される"
          - "Given bizdate scaffold 生成 When bizdate に 8 桁数字以外を指定する Then エラー終了する"
          - "Given template/ が無く既定 config.yml に provision_keys の宣言キーと通常の設定キーがあるプラグイン When stfw new process を実行する Then 生成される config/config.yml に通常の設定キーが残り、宣言キーは複製されない"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "テストシナリオ作成フロー"
          - type: "condition"
            action: "modify"
            target: "階層ディレクトリ判定"
          - type: "condition"
            action: "add"
            target: "外部ツール設定の適用範囲"
      - id: "SPEC-002-02"
        specification: "プロセス配下の scripts/ に任意言語の実行可能ファイルをファイル名昇順 = 実行順で配置し、Process/Plugin 設定（config.yml）の値を環境変数として全スクリプトへ公開できる（組込み → プロジェクト → シナリオ内 Process 設定の順に上書き。従来仕様を維持）。plugin.yml の provision_keys に宣言された外部ツール設定はプロジェクト共通までの値で決める（SPEC-016-04）"
        acceptance_criteria:
          - "Given config.yml に stfw.process.{type} 配下のキーを定義 When プロセスを実行する Then 全スクリプトから環境変数として参照できる"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "condition"
            action: "modify"
            target: "設定の上書き順"
          - type: "condition"
            action: "add"
            target: "外部ツール設定の適用範囲"
      - id: "SPEC-002-03"
        specification: "ワークフロー定義（run.dig / scenario.dig / bizdate.dig）の生成を廃止し、静的検証を新コマンド stfw validate に分離する。validate はディレクトリ規約・プラグイン解決可否・config.yml を検証し、残存する *.dig ファイルには不要と警告する。run 開始前には validate 相当の静的検証が自動実行される。プロセスの config/config.yml に plugin.yml の provision_keys の宣言キーがあれば、プロジェクト共通 config/plugins/process/{type}/config.yml で指定するよう警告する。警告のみなら exit 0（SPEC-016-04、AS-BUILT §3.5）"
        acceptance_criteria:
          - "Given 3 階層のシナリオ構造 When stfw validate を実行する Then ディレクトリ規約・プラグイン解決可否・config.yml が検証され結果が表示される"
          - "Given 旧バージョンで生成した *.dig ファイルが残存 When stfw validate を実行する Then 不要である旨の警告が表示される"
          - "Given 規約違反のあるシナリオ構造 When stfw run を実行する Then run 開始前の自動静的検証でエラーとなり実行は開始されない"
          - "Given プロセスの config/config.yml に provision_keys の宣言キーがありほかにエラーがない When stfw validate を実行する Then プロセスの設定値が使われない旨とプロジェクト共通の設定先を警告し、exit 0 で終了する"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "ワークフロー定義生成・検証フロー"
          - type: "information"
            action: "delete"
            target: "ワークフロー定義（dig）"
          - type: "variation"
            action: "delete"
            target: "dig 生成モード"
          - type: "condition"
            action: "modify"
            target: "実行対象ディレクトリ規則"
          - type: "condition"
            action: "add"
            target: "run 前静的検証"
          - type: "buc"
            action: "modify"
            target: "シナリオ静的検証フロー"
          - type: "condition"
            action: "add"
            target: "外部ツール設定の適用範囲"
      - id: "SPEC-002-04"
        specification: "dry-run は「execute / post_execute をスキップして実行する」の意味に整理する（stfw run --dry-run。setup → pre_execute → teardown は実行される）"
        acceptance_criteria:
          - "Given シナリオ構造作成済み When stfw run --dry-run を実行する Then execute / post_execute は実行されず setup・pre_execute・teardown のみ実行される"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "dry-run の実行範囲"
          - type: "variation"
            action: "modify"
            target: "実行モード（run_mode）"

  - id: "REQ-012"
    event_id: "20261125_092817_reflect_v190_plugin_contracts"
    created_at: "2026-11-25T09:28:17"
    requirement: "シナリオ作成者が、組み込みプラグイン collectLog / collectFile により、テスト対象ホストから実行ログ・ファイル（外部 IF ファイル等）をエビデンスとしてローカルへ自動収集できる（Collect フェーズ）"
    reason: "回帰テストの全自動化にはエビデンス収集の自動化が不可欠であり、業務日付をまたぐ長時間シナリオでは手作業収集は非現実的である。期待値比較（compare）の入力となる収集結果を、規約化されたディレクトリ構造で機械的に集める汎用部品が必要なため"
    priority: "must"
    specifications:
      - id: "SPEC-012-01"
        specification: "collectLog はテスト対象ホストからの実行ログ収集を行う。scenario-test-framework/logfilter（別リポジトリの OSS バイナリ）を利用し、設定（config.yml の stfw.process.{type} 配下）は targets リスト（group: inventory グループ名参照、paths: 収集ファイルパス正規表現リスト）とする。処理は、scp で logfilter バイナリを収集先ホストへ転送 → ssh で実行し「bizdate の実行開始日時」以降のログ行にフィルタ → scp でローカルへ収集 → 転送したバイナリを削除、の順とする。収集結果はエビデンスディレクトリ規約に従い、自プロセスディレクトリ配下の evidence/{host}/{収集元の絶対パスをそのまま再現} へ出力する（evidence/ は gitignore 対象）。フィルタ基準時刻は実行ジャーナルの bizdate node_start イベント時刻を使用し、プラグイン env 契約に追加する環境変数 stfw_bizdate_start_ts（RFC3339 形式）として公開する。収集先ホストとの時刻同期を前提とし、この制約はドキュメントに明記する"
        acceptance_criteria:
          - "Given targets（group: inventory グループ名参照、paths: 収集ファイルパス正規表現リスト）を設定済み When collectLog プロセスを実行する Then logfilter が scp で転送・ssh で実行され、bizdate の実行開始日時以降のログ行のみが自プロセスディレクトリ配下の evidence/{host}/{収集元の絶対パス} へ収集され、転送したバイナリは削除される"
          - "Given bizdate の実行中 When collectLog がフィルタ基準時刻を参照する Then 実行ジャーナルの bizdate node_start イベント時刻が RFC3339 形式の環境変数 stfw_bizdate_start_ts（プラグイン env 契約）として公開されている"
          - "Given collectLog の利用ドキュメント When 前提制約を確認する Then 収集先ホストとの時刻同期が制約として明記されている"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "information"
            action: "modify"
            target: "エビデンス"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "external_system"
            action: "modify"
            target: "logfilter（ログ収集 OSS）"
          - type: "external_system"
            action: "modify"
            target: "テスト対象ホスト群"
          - type: "condition"
            action: "modify"
            target: "収集先ホストとの時刻同期前提"
          - type: "condition"
            action: "modify"
            target: "エビデンスディレクトリ規約"
          - type: "variation"
            action: "modify"
            target: "プロセスタイプ"
      - id: "SPEC-012-02"
        specification: "collectFile はテスト対象ホストからのファイル収集（外部 IF ファイル等）を行う。設定（config.yml の stfw.process.{type} 配下）は targets リスト（group: inventory グループ名参照、paths: 収集ファイルパス正規表現リスト）とし、scp で収集先ホストのファイルをエビデンスディレクトリ規約に従い自プロセスディレクトリ配下の evidence/{host}/{収集元の絶対パスをそのまま再現} へ収集する（evidence/ は gitignore 対象）"
        acceptance_criteria:
          - "Given targets（group: inventory グループ名参照、paths: 収集ファイルパス正規表現リスト）を設定済み When collectFile プロセスを実行する Then 対象ホストのファイルが scp で自プロセスディレクトリ配下の evidence/{host}/{収集元の絶対パス} へ収集される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "エビデンス"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "external_system"
            action: "modify"
            target: "テスト対象ホスト群"
          - type: "condition"
            action: "modify"
            target: "エビデンスディレクトリ規約"
          - type: "variation"
            action: "modify"
            target: "プロセスタイプ"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-012-03"
        specification: "collectLog は targets[] のエントリごとに log_format（text が既定、json は JSON Lines、logfmt は logfmt）、timestamp_key、timestamp_format（auto が既定、unix / unixms / unixus / unixns）を設定できる。json / logfmt では logfilter v2.1.0 の -lf / -tk / -tfmt に指定を渡し、ログ内の時刻フィールドで stfw_bizdate_start_ts から得た基準時刻以降に絞る。JSON Lines の時刻キーはドット区切りで入れ子をたどり、logfmt ではドットもキー名の一部とする。timestamp_key 省略時は logfilter が time、timestamp、ts、@timestamp の順に探す。時刻キーの両端が同種の引用符なら、キー名の引用符を保つため同じ引用符で一重に囲んで渡す。対象エントリの設定はホスト接続前に検査し、不正なら Error（exit 6）とする（AS-BUILT §4.8）"
        acceptance_criteria:
          - "Given 形式の指定がない targets[] エントリ When collectLog を実行する Then 従来のテキスト形式で収集し、形式指定の -lf は渡さない"
          - "Given JSON Lines の入れ子のキー log.ts または logfmt のドットを含むキーを timestamp_key に指定し、timestamp_format に unixms を指定 When collectLog を実行する Then エントリの形式・キー・時刻形式が logfilter に渡され、基準時刻ちょうどとそれ以降の行のみ収集する"
          - "Given 有効なエントリの後、最初に group が無いエントリより手前に設定不正（列挙外の形式・空文字・text での時刻キーや時刻形式の指定・配列として展開された指定）がある When collectLog を実行する Then 先行エントリのホストにも接続せず Error（exit 6）になる"
          - "Given 指定値が空の配列やマップでフラット化結果に現れない When collectLog が設定を検査する Then 省略として扱う。マップでの記述は検出対象にならない"
          - "Given 構造化ログを指定したがプロジェクト共通設定や残存キャッシュにより v2.1.0 より前の logfilter が選ばれる When 未対応オプションで収集が失敗する Then Error（exit 6）となり、版の設定とキャッシュを見直すための対処を stderr に出す"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "external_system"
            action: "modify"
            target: "logfilter（ログ収集 OSS）"
          - type: "condition"
            action: "add"
            target: "collectLog のログ形式設定の事前検証"
          - type: "variation"
            action: "add"
            target: "collectLog ログ形式"
          - type: "variation"
            action: "add"
            target: "collectLog 時刻形式"
      - id: "SPEC-012-04"
        specification: "collectLog は logfilter が基準時刻以降の該当行 0 件を exit 3 で返したとき、空の出力ファイルを通常のエビデンスパスに収集し、そのファイルを成功扱いとして処理を続ける。テキスト・構造化ログの両方に適用し、空の期待値でログが出ないことを検証できる。logfilter の exit 0 / 3 以外は収集失敗とする（AS-BUILT §4.8）"
        acceptance_criteria:
          - "Given テキストまたは構造化ログに基準時刻以降の行が無い When logfilter が exit 3 を返す Then 空の evidence/{host}/{収集元の絶対パス} を収集して続行し、ほかに失敗が無ければ collectLog は成功する"
          - "Given logfilter がオプション不正などにより exit 0 / 3 以外を返す When collectLog が結果を処理する Then そのファイルは収集失敗となる"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "information"
            action: "modify"
            target: "エビデンス"
          - type: "external_system"
            action: "modify"
            target: "logfilter（ログ収集 OSS）"
          - type: "condition"
            action: "add"
            target: "collectLog の該当ログ 0 件時の扱い"

  - id: "REQ-016"
    event_id: "20261125_092817_reflect_v190_plugin_contracts"
    created_at: "2026-11-25T09:28:17"
    requirement: "シナリオ作成者・環境管理者が、組み込みプラグイン群を既存の接続情報管理（inventory / secret / ssh trust）と統一された互換境界（ディレクトリ規約・プラグイン env 契約・エビデンスディレクトリ規約）のもとで安全に利用でき、プラグインのランタイム依存を実行前に検出できる。外部ツールの取得と実行で同じプロジェクト共通設定を使える"
    reason: "プラグインごとに接続情報の持ち方・出力構造・依存の準備方法がばらつくと、設定の重複・平文資格情報の混入・実行時になって判明する依存不足を招く。横断規約として統一することで、組み込みプラグインとカスタムプラグインの 2 層構造によるエコシステム全体の互換性と安全性を担保するため。外部ツールの版を共通設定で管理することで、古いプロセス雛形の設定が更新後の実行を妨げるのを防ぐ"
    priority: "must"
    specifications:
      - id: "SPEC-016-01"
        specification: "収集先・接続先ホストは既存の inventory（ホストグループ）を参照し、資格情報は secret（age 暗号化）、SSH ホストキーは ssh trust を利用する。プラグイン設定は config.yml の stfw.process.{type} 配下に置き、既存の env フラット化規則で全スクリプトへ環境変数として公開される。設定スキーマは、収集系プラグインが targets リスト（group: inventory グループ名参照、paths: 収集ファイルパス正規表現リスト）、データストア系プラグインが host_group（inventory グループ名参照）・port・database・user・tables（テーブル名リスト）等とする。データストア系のパスワードは secret の {host}-{user} を自動参照する。接続情報（ホスト・パスワード）を config.yml に直接書くことは禁止する。各設定値の適用範囲は、plugin.yml の provision_keys に宣言したキーに限り SPEC-016-04 に従う"
        acceptance_criteria:
          - "Given 組み込みプラグインの設定（config.yml） When 収集先・接続先を指定する Then 収集系は targets（group / paths）、データストア系は host_group 等の inventory グループ名参照のみで指定でき、ホスト名・資格情報は直接記述しない"
          - "Given stfw.process.{type} 配下のプラグイン設定 When プロセスを実行する Then 既存の env フラット化規則で全スクリプトへ環境変数として公開される"
          - "Given データストア系プラグインの接続 When 資格情報を利用する Then secret（age 暗号化）の {host}-{user} が自動参照され、SSH 接続では ssh trust（known_hosts）の既存機構が利用される"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "プラグイン接続情報のグループ名参照"
          - type: "information"
            action: "modify"
            target: "インベントリ"
          - type: "information"
            action: "modify"
            target: "パスワード"
          - type: "information"
            action: "modify"
            target: "SSH サーバキー（known_hosts）"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "buc"
            action: "modify"
            target: "接続情報管理フロー"
          - type: "condition"
            action: "add"
            target: "外部ツール設定の適用範囲"
      - id: "SPEC-016-02"
        specification: "エビデンスディレクトリ規約を定める。収集系プラグイン（collectFile / collectLog / exportXxx）の出力ルートは自プロセスディレクトリ配下の evidence/（gitignore 対象）とし、collectFile / collectLog は evidence/{host}/{収集元の絶対パスをそのまま再現}、exportMysql / exportPostgres は evidence/{database}/{table}.csv、exportRedis は evidence/{host}/{keyパターン名}.csv へ出力する。compare プラグインのディレクトリは、expect/（git 管理。直下に同一 bizdate 内の収集系 process ディレクトリ名を置き、その配下は当該 process の evidence/ 配下と同型）、actual/（gitignore・自動生成。expect と同じ構造で実体は各収集系 process の evidence/ への symlink）、result/（gitignore。compare-files の比較結果出力）とする。本規約はディレクトリ規約・プラグイン env 契約に次ぐ第 3 の互換境界として文書化する。実行で生成される evidence/・actual/・result/ の実体は run ワークスペース内のプロセスディレクトリに置く（REQ-029）"
        acceptance_criteria:
          - "Given 収集系プラグインの出力 When 出力先を確認する Then 自プロセスディレクトリ配下の evidence/（gitignore 対象）に、collectFile / collectLog は {host}/{収集元の絶対パス}、exportMysql / exportPostgres は {database}/{table}.csv、exportRedis は {host}/{keyパターン名}.csv として配置される"
          - "Given compare の expect/ ディレクトリ When 構造を確認する Then 直下に同一 bizdate 内の収集系 process ディレクトリ名が置かれ、その配下は当該 process の evidence/ 配下と同型である"
          - "Given エビデンスディレクトリ規約 When 互換境界の位置づけを確認する Then ディレクトリ規約・プラグイン env 契約に次ぐ第 3 の互換境界として文書化されている"
        affected_models:
