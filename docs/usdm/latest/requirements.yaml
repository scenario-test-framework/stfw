  - id: "REQ-014"
    event_id: "20261125_140812_reflect_compare_files_v230"
    created_at: "2026-11-25T14:08:12"
    requirement: "シナリオ作成者が、組み込みプラグイン compare により、収集したエビデンスと期待値（expect）の比較検証（Assert）を自動実行でき、比較不一致の扱いを on_mismatch 設定で選択できる（error=ステップ失敗として停止（既定・従来挙動）/ warn=Warn として記録して続行）。プロセスローカルの起動設定で、真偽項目に false を書いて共通設定の true を無効化し、一覧項目に [] を書いて共通設定の一覧を空にできる"
    reason: "期待値比較の自動化は回帰テスト全自動化の最終段であり、人手の目視比較では網羅性・再現性を担保できない。回帰テスト（完全一致確認）では比較不一致を既存のエラー時停止・Blocked 伝播の仕組みに載せて失敗の検知と調査を既存の結果確認手段（status / report / OTel トレース）に一元化し、機能変更の差分確認では比較不一致を Warn として最後まで実行を進めた後に比較 NG を鳥瞰する、という 2 つの運用モードを on_mismatch 設定の選択制で両立するため。共通設定を再利用しつつ、個別の比較で不要な並び替えや除外条件を解除できるようにするため"
    priority: "must"
    specifications:
      - id: "SPEC-014-01"
        specification: "compare は scenario-test-framework/compare-files（別リポジトリの OSS）を利用する。compare-files の起動設定・比較レイアウトは stfw プロジェクトごとに持たせる。compare プラグインのディレクトリは、expect/（git 管理）: 直下に「同一 bizdate 内の収集系 process ディレクトリ名」を置き、その配下は当該 process の evidence/ 配下と同型にする。actual/（gitignore・自動生成）: expect と同じ構造で、実体は各収集系 process の evidence/ への symlink とする。result/（gitignore）: compare-files の比較結果出力とする。処理は、actual ディレクトリを組み立て（各収集系 process の evidence/ への symlink）→ compare-files を実行 → 比較結果を result/ へ出力、の順とする"
        acceptance_criteria:
          - "Given expect/ 直下に同一 bizdate 内の収集系 process ディレクトリ名を置き、その配下を当該 process の evidence/ 配下と同型に配置済み When compare プロセスを実行する Then actual/ が expect と同じ構造で各収集系 process の evidence/ への symlink として組み立てられ、compare-files が実行され、比較結果が result/ へ出力される"
          - "Given compare の実行後 When プロジェクトの git 管理状態を確認する Then expect/ は git 管理対象で、actual/ と result/ は gitignore 対象である"
          - "Given compare-files の起動設定・比較レイアウト When 配置場所を確認する Then stfw プロジェクトごとに保持されている"
        affected_models:
          - type: "information"
            action: "modify"
            target: "期待値（expect）"
          - type: "information"
            action: "modify"
            target: "比較結果"
          - type: "information"
            action: "modify"
            target: "エビデンス"
          - type: "external_system"
            action: "modify"
            target: "compare-files（ファイル比較 OSS）"
          - type: "condition"
            action: "modify"
            target: "エビデンスディレクトリ規約"
          - type: "variation"
            action: "modify"
            target: "プロセスタイプ"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-014-02"
        specification: "改訂: 比較不一致の扱いは compare プラグインの設定キー on_mismatch: error（既定）| warn による選択制とする。error（既定）は従来挙動を維持し、比較不一致（compare-files exit 3）を Error（exit 6）に変換してステップ失敗とし、既存のエラー時停止・Blocked 伝播の対象とする（回帰テスト運用との後方互換）。warn のときは compare-files の比較不一致（exit 3）を exit 3 のまま返し（6 に変換しない）、該当ステップは Warn として記録され後続の実行は継続する。expect と actual が一致した場合はいずれの設定でもステップは Success となり後続処理が継続する"
        acceptance_criteria:
          - "Given on_mismatch 未設定（既定 error）で expect と actual に差分がある When compare プロセスを実行する Then 従来どおり該当ステップは Error となり、後続ステップは Blocked として記録され実行が停止する"
          - "Given on_mismatch: warn で expect と actual に差分がある When compare プロセスを実行する Then compare-files の exit 3 が exit 3 のまま返され（6 に変換されない）、該当ステップは Warn として記録され後続の実行が継続する"
          - "Given expect と actual が一致する When compare プロセスを実行する Then on_mismatch の設定によらずステップは Success となり後続処理が継続する"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "比較不一致はステップ失敗"
          - type: "condition"
            action: "modify"
            target: "逐次実行・エラー時 Blocked"
          - type: "state"
            action: "modify"
            target: "ステップ実行ステータス"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "variation"
            action: "add"
            target: "compare on_mismatch 設定"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-014-03"
        specification: "compare と compareRegex は compare-files v2.3.0 を既定とする。プロセスローカルの config/compare_files.{json,yaml,yml} をこの順で探し、見つけたファイルを -config に指定する。補完元は COMPAREFILES_CLASSPATH の各要素 → カレント → ./config の順で最初に見つかった起動設定 1 件とする。補完対象は未記述項目、真偽・一覧・文字列・画像スタイル項目の null、文字列項目の空文字とする。明示した false（sorted / writeDiffOnly / deleteWorkDir）と空配列 []（ignoreFileRegexList / ignoreItemList / ignoreAreaList）は保持する。真偽項目の空文字は false、数値項目の null は 0 として使う。v2.2.4 までは false と空配列も補完対象だった。同梱の compare_files.json の複製では sorted / writeDiffOnly の false が共通側の true より優先される。共通側の値を使う項目は複製から削除できる。大文字・小文字だけが異なる同一キーの併記は読込エラー（exit 6）とし、同一項目をフラット形式と階層形式（input / compare / output）の両方で指定した場合は綴りにかかわらず階層形式を優先する（AS-BUILT §4.11 手順 4・§4.11.1 手順 6）"
        acceptance_criteria:
          - "Given compare または compareRegex の compare_files_version が未上書き When プラグインの設定版を解決する Then v2.3.0 になる"
          - "Given 補完元で対象の真偽項目が true、一覧項目が非空 When プロセスローカルで sorted / writeDiffOnly / deleteWorkDir を false、ignoreFileRegexList / ignoreItemList / ignoreAreaList を [] にして各プラグインを起動する Then -config で渡した false と [] が保持される"
          - "Given 探索順で先行する起動設定とタイプ別のプロジェクト共通起動設定がある When 各プラグインを起動する Then ローカルで未記述の項目、真偽・一覧・文字列・画像スタイル項目の null、文字列項目の空文字を最初に見つかった起動設定 1 件の値で補う"
          - "Given 補完元の真偽項目が true で数値項目が非ゼロ When プロセスローカルで真偽項目を空文字、数値項目を null にして各プラグインを起動する Then それぞれ false、0 が使われる"
          - "Given 同梱の compare_files.json をプロセスローカルに複製し、補完元になる共通設定の sorted / writeDiffOnly が true When 各プラグインを起動する Then 複製に書かれた false が優先され、該当キーを複製から削除すると共通側の true を引き継ぐ。空でない一覧は複製側の値が優先される"
          - "Given 起動設定に Sorted と sorted を併記 When 各プラグインがそのファイルを読み込む Then 読込エラーでステップが Error（exit 6）になる"
          - "Given フラット形式と階層形式で同じ項目を異なる値で指定 When 各プラグインが起動設定を読む Then フラットキーの綴りにかかわらず階層形式（input / compare / output）の値が使われる"
        affected_models:
          - type: "condition"
            action: "add"
            target: "compare / compareRegex の起動設定補完"
          - type: "external_system"
            action: "modify"
            target: "compare-files（ファイル比較 OSS）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"

