  - id: "REQ-022"
    event_id: "20261125_092817_reflect_v190_plugin_contracts"
    created_at: "2026-11-25T09:28:17"
    requirement: "シナリオ作成者が、複数プロセスで共通の設定値を stfw.yml に単一ソース化し、各プロセス config には固有値（テーブル名等）だけを書けるよう、config の ${...} 展開から stfw.yml の設定値を参照できる"
    reason: "共通設定値を各プロセス config に重複記述すると、ユーザー変更時のメンテ漏れを招く。共通の identity（database / user 等）を stfw.yml に集約し、config からは ${stfw_...} で参照できるようにすることで、単一ソース化してメンテ漏れを防げるため"
    priority: "should"
    specifications:
      - id: "SPEC-022-01"
        specification: "プラグイン / プロセスの config チェーン（プラグイン既定 -> プロジェクト config/plugins/process/{type}/ -> プロセス config/config.yml）の値中の ${VAR} 展開は環境変数を参照する。stfw run 開始時に stfw.yml（+ 同梱デフォルト）のフラット化結果を実行環境へ export する（v0.2 の export_yaml 互換）ため、config から stfw.yml の設定値を ${stfw_...} で参照できる。例: DB 接続先の identity（database / user）を stfw.yml の stfw.db.database / stfw.db.user に集約し、各 postgres 系プラグインの共通設定（config/plugins/process/{type}/config.yml）から ${stfw_db_database} / ${stfw_db_user} で参照する。各シナリオのプロセス config はテーブル名だけを書く。stfw plugin install も stfw.yml（+ 同梱デフォルト）のフラット化結果を環境に反映してからプラグイン設定を読み、共通設定の ${...} を stfw run と同じ値に展開する（AS-BUILT §2.3・§4.7・§8.2）"
        acceptance_criteria:
          - "Given stfw.yml に stfw.db.database / stfw.db.user を定義し、config/plugins/process/{type}/config.yml で ${stfw_db_database} / ${stfw_db_user} を参照 When stfw run を実行する Then run 開始時に stfw.yml（+ 同梱デフォルト）のフラット化結果が実行環境へ export され、config の ${stfw_...} が stfw.yml の設定値に展開される"
          - "Given config 値中の ${VAR} When プロセスを実行する Then ${VAR} は実行環境の環境変数を参照して展開される"
          - "Given 共通の identity を stfw.yml に集約済み When 各シナリオのプロセス config を確認する Then プロセス config には固有値（テーブル名等）だけが記述され、共通設定値は重複記述されない"
          - "Given プロジェクト共通の外部ツール設定キーが stfw.yml の値を ${stfw_...} で参照する When stfw plugin install と stfw run がプラグイン設定を読む Then 両方で同じ stfw.yml の値に展開される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "プロジェクト設定（stfw.yml）"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "condition"
            action: "add"
            target: "config の ${...} 環境変数展開（stfw.yml 値参照）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "condition"
            action: "modify"
            target: "config の ${...} 環境変数展開（stfw.yml 値参照）"
          - type: "buc"
            action: "modify"
            target: "プロセスプラグイン拡張フロー"
      - id: "SPEC-022-02"
        specification: "接続先ホスト・パスワードは従来どおり config に直書きせず inventory（ホスト解決）+ secret（パスワード）から解決する禁止契約を維持する。本変更は identity である database / user の集約であり、接続情報（ホスト・パスワード）の config 直書き解禁ではない"
        acceptance_criteria:
          - "Given データストア系プラグインの config When 接続情報を確認する Then 接続先ホストは inventory、パスワードは secret から解決され、config への直書きはない（禁止契約を維持）"
          - "Given 本変更の適用後 When 集約対象を確認する Then 集約されるのは identity（database / user）のみで、接続情報（ホスト・パスワード）の直書きは解禁されていない"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "プラグイン接続情報のグループ名参照"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"

  - id: "REQ-023"
    event_id: "20260712_015850_warn_first_class_status"
    created_at: "2026-07-12T01:58:50"
    requirement: "テスト実行者が、プロセスプラグインのリターンコード 3（Warn）に実行意味論を持たせた一級実行ステータス Warn により、機能変更の差分確認モード（比較不一致等を Warn として最後まで実行を進める）でシナリオテストを運用でき、CI では stfw run の終了コード（全 Success=0 / Warn あり・Error なし=3 / Error あり=6）で「差分あり」を検知できる"
    reason: "シナリオテストの運用には、完全一致を確認し比較不一致で Error 停止してほしい回帰テストモード（現状の挙動）と、狙い通りの差分が全シナリオで発生することを検出したい機能変更の差分確認モードの 2 つがある。現状はプロセスプラグイン RC 契約の 3=Warn が体系上の予約に留まり、ランナーの成否判定は「0 か否か」で 3 も Error と同じ扱いになるため、比較不一致で実行が全階層停止し、比較 NG を最後まで進めて鳥瞰する後者の運用が実現できないため"
    priority: "must"
    specifications:
      - id: "SPEC-023-01"
        specification: "プロセスプラグインのリターンコード 3（Warn）に実行意味論を与える。該当ステップ / プロセスを Warn として実行ジャーナルに記録し、後続の実行は止めない。Error（6 等の非 0・非 3）は従来どおり停止 + 後続 Blocked 伝播とする。プロセスプラグイン実行契約（RC 0/3/6）自体は変えず意味論の追加のため既存プラグインは壊れないが、3 を返していたプラグインは「止まらなくなる」挙動変化があるためリリースノートで明示する"
        acceptance_criteria:
          - "Given 3 つのスクリプトを昇順配置 When 2 番目がリターンコード 3 で終了する Then 2 番目は Warn として実行ジャーナルに記録され、3 番目は実行される"
          - "Given 3 つのスクリプトを昇順配置 When 2 番目がリターンコード 6（非 0・非 3）で終了する Then 従来どおり 3 番目は実行されず Blocked と記録され実行が停止する"
          - "Given プロセスプラグイン実行契約 When RC 体系を確認する Then リターンコードは 0=Success / 3=Warn / 6=Error のまま変更されていない（意味論の追加のみ）"
          - "Given リリースノート When 挙動変化の記載を確認する Then RC 3 を返していたプラグインが「止まらなくなる」挙動変化が明示されている"
        affected_models:
          - type: "state"
            action: "modify"
            target: "ステップ実行ステータス"
          - type: "state"
            action: "modify"
            target: "階層実行ステータス"
          - type: "condition"
            action: "modify"
            target: "逐次実行・エラー時 Blocked"
          - type: "variation"
            action: "modify"
            target: "終了コード"
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "information"
            action: "modify"
            target: "ステップ実行結果"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-023-02"
        specification: "上位階層（process / bizdate / scenario / run）の実行ステータス集約は Error > Warn > Success の優先度で行う。子に Warn があれば親も Warn になる（子に Error があれば親は Error）"
        acceptance_criteria:
          - "Given プロセス内の一部ステップが Warn・残りが Success When プロセスが終了する Then プロセスの階層実行ステータスは Warn になる"
          - "Given 配下に Warn の process を含む bizdate / scenario / run When 各階層が終了する Then 各階層の実行ステータスは Warn になる（Error > Warn > Success の優先度で集約される）"
          - "Given 配下に Warn と Error の両方を含む階層 When 階層が終了する Then 階層の実行ステータスは Error になる"
        affected_models:
          - type: "state"
            action: "modify"
            target: "階層実行ステータス"
          - type: "condition"
            action: "add"
            target: "実行ステータス集約（Error > Warn > Success）"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-023-03"
        specification: "stfw run の終了コードは、全 Success=0 / Warn あり（Error なし）=3 / Error あり=6 とする。CI で「差分あり」を終了コードで検知できるようにする"
        acceptance_criteria:
          - "Given 全階層・全ステップが Success の実行 When stfw run が終了する Then 終了コードは 0 である"
          - "Given Warn を含み Error を含まない実行 When stfw run が終了する Then 終了コードは 3 であり、CI から「差分あり」を検知できる"
          - "Given Error を含む実行 When stfw run が終了する Then 終了コードは 6 である"
        affected_models:
          - type: "condition"
            action: "add"
            target: "run 終了コードの集約（0/3/6）"
          - type: "variation"
            action: "modify"
            target: "終了コード"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "actor"
            action: "modify"
            target: "テスト実行者"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-023-04"
        specification: "実行ジャーナルの status に Warn を追加する。旧バージョンの run のジャーナル（Warn なし）と混在しても、report 再生成・housekeep・status が壊れないこと（後方互換）"
        acceptance_criteria:
          - "Given Warn を含む実行 When 実行ジャーナル（journal.jsonl）を参照する Then status に Warn が記録されている"
          - "Given 旧バージョンの run のジャーナル（Warn なし）と新バージョンのジャーナルが混在 When stfw report / stfw status を実行する Then いずれのジャーナルもエラーなく処理され表示・再生成される"
          - "Given 旧バージョンの run のジャーナルが混在 When stfw run 開始時のハウスキープが実行される Then 旧ジャーナルも含めて保存期間判定・削除が壊れずに動作する"
        affected_models:
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "condition"
            action: "add"
            target: "Warn ステータスの後方互換（旧ジャーナル混在）"
          - type: "condition"
            action: "modify"
            target: "実行結果ハウスキープ"
          - type: "information"
            action: "modify"
            target: "HTML レポート"
          - type: "buc"
            action: "modify"
            target: "実行結果監視・確認フロー"
      - id: "SPEC-023-05"
        specification: "teardown フックへ公開する stfw_run_status に Warn が入るケースを定義する。Warn あり・Error なしの run では stfw_run_status=Warn とする"
        acceptance_criteria:
          - "Given Warn を含み Error を含まない run When teardown フックが実行される Then 環境変数 stfw_run_status の値は Warn である"
          - "Given 全 Success の run When teardown フックが実行される Then stfw_run_status の値は従来どおり Success である"
        affected_models:
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "state"
            action: "modify"
            target: "階層実行ステータス"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"

