requirements:
  - id: "REQ-001"
    event_id: "20260708_084933_v1_rearchitecting"
    created_at: "2026-07-08T08:52:24"
    requirement: "テスト担当者が、マルチプラットフォームバイナリ / Docker image / compose.yaml のいずれかの配布物とテンプレート初期化のみでシナリオテスト実行基盤（stfw プロジェクト）を各ホストに用意できる"
    reason: "導入の容易さが利用開始の前提であることは変わらない。v1.0 で Go 単一バイナリ化したことにより、依存モジュールのダウンロード（到達不能となっていた dl.bintray.com）や JVM / Python 2 / Ruby のランタイム準備が不要になり、導入の容易さをより確実に実現できるため"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "配布方式をマルチプラットフォームバイナリ（GitHub Releases: linux/darwin × amd64/arm64 + windows/amd64）、Docker image（ghcr.io）、compose.yaml（stfw + nginx）に変更する。tar.gz 展開 + install スクリプト（dl.bintray.com からの依存ダウンロード）は廃止する。依存モジュール（digdag jar / Tukubai / Parsrs / yaml2json）は存在せず、JVM / Python 2 / Ruby は不要とする"
        acceptance_criteria:
          - "Given GitHub Releases から対象プラットフォームのバイナリを取得済み When 実行パスに配置して stfw を実行する Then 追加のランタイム・依存モジュールなしに stfw コマンドが利用可能になる"
          - "Given ghcr.io の Docker image または compose.yaml When コンテナを起動する Then stfw コマンドが利用可能になる"
          - "Given v1.0 の配布物 When 導入手順を実施する Then install スクリプトの実行と依存モジュールのダウンロードは発生しない"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "stfw導入フロー"
          - type: "information"
            action: "modify"
            target: "stfw 本体"
          - type: "information"
            action: "delete"
            target: "依存モジュール"
          - type: "external_system"
            action: "delete"
            target: "dl.bintray.com"
          - type: "external_system"
            action: "add"
            target: "配布元（GitHub Releases / ghcr.io）"
          - type: "variation"
            action: "modify"
            target: "対応 OS 種別"
      - id: "SPEC-001-02"
        specification: "stfw init でテンプレート一式（stfw.yml / config / sample シナリオ）を展開してプロジェクトを開始できる。stfw.yml が既に存在するディレクトリでは再初期化をエラーとする（従来仕様を維持）"
        acceptance_criteria:
          - "Given 空のプロジェクトディレクトリ When stfw init を実行する Then stfw.yml・config/・scenario/sample が生成される"
          - "Given stfw.yml が存在するディレクトリ When stfw init を実行する Then エラー終了する"
        affected_models:
          - type: "information"
            action: "modify"
            target: "プロジェクト"
          - type: "condition"
            action: "modify"
            target: "プロジェクト再初期化禁止"
      - id: "SPEC-001-03"
        specification: "プロジェクト設定（stfw.yml）はデフォルト（stfw 本体の内蔵デフォルト）→ プロジェクトの順に読込・上書きされ、環境変数として全スクリプトへ公開される（従来の上書き順を維持。STFW_HOME/config は廃止）。stfw.yml の stfw.server.* 設定は廃止され、読み込み時に廃止警告を表示する"
        acceptance_criteria:
          - "Given プロジェクトの stfw.yml でデフォルト設定値を上書きした状態 When 任意のコマンドを実行する Then プロジェクト側の値が環境変数として有効になる"
          - "Given stfw.server.* 設定を含む stfw.yml When 設定を読み込む Then 廃止警告が表示され、設定値は実行に影響しない"
        affected_models:
          - type: "information"
            action: "modify"
            target: "プロジェクト設定（stfw.yml）"
          - type: "condition"
            action: "modify"
            target: "設定の上書き順"
          - type: "condition"
            action: "add"
            target: "server 設定の廃止警告"
      - id: "SPEC-001-04"
        specification: "STFW_HOME（配布ディレクトリ）概念を廃止する。プラグインに対する env 契約（stfw_* / STFW_PROJ_DIR 系の環境変数公開）は維持する"
        acceptance_criteria:
          - "Given v1.0 のバイナリ When STFW_HOME を設定せずに任意のコマンドを実行する Then 正常に動作する"
          - "Given プラグインのスクリプト When プロセスを実行する Then stfw_* / STFW_PROJ_DIR 系の環境変数が従来どおり公開されている"
        affected_models:
          - type: "information"
            action: "modify"
            target: "stfw 本体"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "condition"
            action: "modify"
            target: "プラグイン解決順"

  - id: "REQ-002"
    event_id: "20261125_092817_reflect_v190_plugin_contracts"
    created_at: "2026-11-25T09:28:17"
    requirement: "シナリオ作成者が、業務日付（bizdate）をまたぐ一連の業務処理を scenario > bizdate > process の 3 階層ディレクトリ構造とスクリプトとして記述し、静的検証（stfw validate）で実行可能性を事前確認できる"
    reason: "業務日付の進行を伴うバッチ処理系業務システムのシナリオテストでは、日付単位でテストを区切って進行させる必要がある。v1.0 ではワークフロー定義（dig）の生成・管理が不要になり、記述したディレクトリ構造そのものが実行定義となるため、検証は静的検証コマンドに分離した"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "scaffold 生成コマンドを stfw new scenario / stfw new bizdate / stfw new process に刷新する（旧 scenario -i / bizdate -i / process -i）。3 階層の scaffold（ディレクトリ・metadata.yml・config・scripts 雛形）生成と、bizdate は YYYYMMDD の 8 桁数字・seq は数値のみ・group は「_」を含まないことの検証は同一仕様で維持する。stfw new process でプラグインに template/ が無く、既定 config.yml を config/config.yml として複製する場合は、plugin.yml の provision_keys に宣言したキーを除く（SPEC-016-04、AS-BUILT §2.3・§4.7）"
        acceptance_criteria:
          - "Given プロジェクト初期化済み When stfw new scenario / new bizdate / new process を順に実行する Then scenario/{name}/_{seq}_{bizdate}/_{seq}_{group}_{type}/ の階層が生成される"
          - "Given bizdate scaffold 生成 When bizdate に 8 桁数字以外を指定する Then エラー終了する"
          - "Given template/ が無く既定 config.yml に provision_keys の宣言キーと通常の設定キーがあるプラグイン When stfw new process を実行する Then 生成される config/config.yml に通常の設定キーが残り、宣言キーは複製されない"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "テストシナリオ作成フロー"
          - type: "condition"
            action: "modify"
            target: "階層ディレクトリ判定"
          - type: "condition"
            action: "add"
            target: "外部ツール設定の適用範囲"
      - id: "SPEC-002-02"
        specification: "プロセス配下の scripts/ に任意言語の実行可能ファイルをファイル名昇順 = 実行順で配置し、Process/Plugin 設定（config.yml）の値を環境変数として全スクリプトへ公開できる（組込み → プロジェクト → シナリオ内 Process 設定の順に上書き。従来仕様を維持）。plugin.yml の provision_keys に宣言された外部ツール設定はプロジェクト共通までの値で決める（SPEC-016-04）"
        acceptance_criteria:
          - "Given config.yml に stfw.process.{type} 配下のキーを定義 When プロセスを実行する Then 全スクリプトから環境変数として参照できる"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "condition"
            action: "modify"
            target: "設定の上書き順"
          - type: "condition"
            action: "add"
            target: "外部ツール設定の適用範囲"
      - id: "SPEC-002-03"
        specification: "ワークフロー定義（run.dig / scenario.dig / bizdate.dig）の生成を廃止し、静的検証を新コマンド stfw validate に分離する。validate はディレクトリ規約・プラグイン解決可否・config.yml を検証し、残存する *.dig ファイルには不要と警告する。run 開始前には validate 相当の静的検証が自動実行される。プロセスの config/config.yml に plugin.yml の provision_keys の宣言キーがあれば、プロジェクト共通 config/plugins/process/{type}/config.yml で指定するよう警告する。警告のみなら exit 0（SPEC-016-04、AS-BUILT §3.5）"
        acceptance_criteria:
          - "Given 3 階層のシナリオ構造 When stfw validate を実行する Then ディレクトリ規約・プラグイン解決可否・config.yml が検証され結果が表示される"
          - "Given 旧バージョンで生成した *.dig ファイルが残存 When stfw validate を実行する Then 不要である旨の警告が表示される"
          - "Given 規約違反のあるシナリオ構造 When stfw run を実行する Then run 開始前の自動静的検証でエラーとなり実行は開始されない"
          - "Given プロセスの config/config.yml に provision_keys の宣言キーがありほかにエラーがない When stfw validate を実行する Then プロセスの設定値が使われない旨とプロジェクト共通の設定先を警告し、exit 0 で終了する"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "ワークフロー定義生成・検証フロー"
          - type: "information"
            action: "delete"
            target: "ワークフロー定義（dig）"
          - type: "variation"
            action: "delete"
            target: "dig 生成モード"
          - type: "condition"
            action: "modify"
            target: "実行対象ディレクトリ規則"
          - type: "condition"
            action: "add"
            target: "run 前静的検証"
          - type: "buc"
            action: "modify"
            target: "シナリオ静的検証フロー"
          - type: "condition"
            action: "add"
            target: "外部ツール設定の適用範囲"
      - id: "SPEC-002-04"
        specification: "dry-run は「execute / post_execute をスキップして実行する」の意味に整理する（stfw run --dry-run。setup → pre_execute → teardown は実行される）"
        acceptance_criteria:
          - "Given シナリオ構造作成済み When stfw run --dry-run を実行する Then execute / post_execute は実行されず setup・pre_execute・teardown のみ実行される"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "dry-run の実行範囲"
          - type: "variation"
            action: "modify"
            target: "実行モード（run_mode）"

  - id: "REQ-003"
    event_id: "20261125_050658_reflect_run_workspace_resume_bundled_tools"
    created_at: "2026-11-25T05:06:58"
    requirement: "テスト実行者が、ディレクトリ構造で記述したシナリオテスト（複数シナリオ）を Go 単一バイナリに内蔵された逐次実行ランナーで一括自動実行でき、実行順序の保証とエラー時停止が担保される"
    reason: "ディレクトリ構造どおりのワークフロー自動実行がフレームワークの中核目的であることは変わらない。v1.0 では外部ワークフローエンジン digdag を廃止して実行エンジンを内包したことで、server 起動などの前準備なしに 1 コマンドで実行でき、実行順序保証・エラー時停止・Blocked 伝播は内蔵ランナーが同一仕様で提供するため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "stfw run <scenario-names...> は validate 相当の静的検証（対象シナリオの存在チェック等を含む）を通過後、run_id（_{YYYYMMDDHHMMSS}_{PID}、採番規則は SPEC-003-04）を採番し、実行ワークスペース（REQ-029）を用意して内蔵ランナーで実行を開始する。digdag プロジェクトの push・attempt_id・「digdag server が起動中であること」の前提条件は廃止し、旧 server start → run -f の 2 段階を 1 コマンドに統合する"
        acceptance_criteria:
          - "Given シナリオ存在 When stfw run を実行する Then 前準備コマンドなしに run_id が採番され実行が開始される"
          - "Given 対象シナリオが存在しない When stfw run を実行する Then run 開始前の静的検証でエラー終了する"
          - "Given v1.0 の stfw When 実行コンテキストを確認する Then attempt_id は存在せず run_id で実行が識別される"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "information"
            action: "modify"
            target: "実行コンテキスト"
          - type: "condition"
            action: "modify"
            target: "run 実行の前提条件"
          - type: "condition"
            action: "delete"
            target: "run_id / attempt_id の採番・保持"
          - type: "condition"
            action: "add"
            target: "run_id の採番・保持"
          - type: "external_system"
            action: "delete"
            target: "digdag"
      - id: "SPEC-003-02"
        specification: "改訂: 内蔵ランナーが run / scenario / bizdate 各階層の setup / teardown を直接実行し（digdag からの呼び戻しは廃止）、実行ジャーナルへ開始・終了イベントを記録して階層実行ステータス（Started → Success / Warn / Error）を確定させる（Warn の集約規則は REQ-023 / SPEC-023-02 を参照）"
        acceptance_criteria:
          - "Given シナリオ実行中 When 全タスクが正常終了する Then 各階層の teardown で階層実行ステータスが Success になる"
          - "Given シナリオ実行中 When タスクがエラー終了する Then 該当階層の階層実行ステータスが Error になる"
        affected_models:
          - type: "state"
            action: "modify"
            target: "階層実行ステータス"
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "external_system"
            action: "delete"
            target: "digdag"
      - id: "SPEC-003-03"
        specification: "改訂: プロセスを setup → pre_execute → execute → post_execute → teardown の順で実行し、scripts プラグインでは scripts/ 配下をファイル名昇順に逐次実行する。エラー発生時は後続スクリプトを実行せず Blocked として記録しエラー終了する。exit 3 は Warn として記録して続行する（ステップ実行ステータス: Pending → Success / Warn / Error / Blocked。Warn の実行意味論は REQ-023 / SPEC-023-01 を参照）。これらを内蔵ランナーが提供する"
        acceptance_criteria:
          - "Given 3 つのスクリプトを昇順配置 When 2 番目がエラー終了する Then 3 番目は実行されず Blocked と記録されプロセスは Error になる"
          - "Given 全スクリプトが正常終了 When プロセスを実行する Then 全ステップが Success となりプロセスは Success になる"
        affected_models:
          - type: "state"
            action: "modify"
            target: "ステップ実行ステータス"
          - type: "condition"
            action: "modify"
            target: "逐次実行・エラー時 Blocked"
          - type: "external_system"
            action: "delete"
            target: "digdag"
      - id: "SPEC-003-04"
        specification: "run_id は秒単位の採番時刻とプロセス ID から _{YYYYMMDDHHMMSS}_{PID} 形式で生成する。通常は現在時刻を用いる。最新 run の採番時刻が現在時刻以上で差が 24 時間以内なら最新の採番時刻に 1 秒を加え、最新 run が 24 時間を超えて未来なら現在時刻を用いる。この場合、新しい run は採番順でその未来の run より古くなる。同時に採番した run は同じ採番時刻になり得る。既存 run_id と衝突したら時刻を 1 秒ずつ進めて最大 10 回まで再採番する。run_id 形式のディレクトリは採番時刻、同時刻なら pid の数値で昇順に並べる。この順序を status / report の最新 run、HTML レポート一覧、--resume の最新の完了済み run の選択に用いる（AS-BUILT §5.1〜§5.2・§5.5）"
        acceptance_criteria:
          - "Given 最新 run の採番時刻が現在時刻と同じ、または 24 時間以内の未来 When 新しい run を採番する Then 最新 run の採番時刻に 1 秒を加えた時刻を使う"
          - "Given 最新 run の採番時刻が 24 時間を超えて未来 When 新しい run を採番する Then 現在時刻を使い、採番順では新しい run がその未来の run より前に並ぶ"
          - "Given 並走 run が同じ採番時刻で異なる pid を持つ When run を並べる Then pid 9 は pid 10 より前になり、引数省略時の status / report は並びの末尾を、--resume は完了済みの中の末尾を選ぶ"
          - "Given 採番した run_id のディレクトリが既に存在する When 新規作成を試みる Then 採番時刻を 1 秒ずつ進めて最大 10 回まで再採番する"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "run_id の採番・保持"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "buc"
            action: "modify"
            target: "実行結果監視・確認フロー"
          - type: "information"
            action: "modify"
            target: "HTML レポート"

