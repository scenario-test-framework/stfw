  - id: "REQ-027"
    event_id: "20261125_050658_reflect_run_workspace_resume_bundled_tools"
    created_at: "2026-11-25T05:06:58"
    requirement: "シナリオ作成者・テスト実行者が、単一 run 内の組込み parallel プロセスで、順序依存の無い子プロセスを並走させて実行時間を短縮できる"
    reason: "業務日付内には順序依存の無い処理（複数ホストからの収集・複数データストアの準備等）がある。単一 run 内の通常の実行順序とエラー時停止を維持しつつ、parallel 配下では並走を選べるようにするため（AS-BUILT §4.14）。同一シナリオを別 run として並走させる要件は REQ-029 を参照する。単一 run 内でも、互換境界（ディレクトリ規約・プラグイン実行契約・エビデンスディレクトリ規約・ジャーナル）は維持する。複数ユーザーの同時アクセスやスループットのスケールアウトは対象外とし、性能要件と非機能要求グレードは現行水準を前提とする。"
    priority: "should"
    specifications:
      - id: "SPEC-027-01"
        specification: "組込み parallel プロセスタイプを提供する。parallel プロセスはディレクトリ配下に子プロセスディレクトリ（親と同形式 _{seq}_{group}_{type}）を持ち、それらを並走させる。子のタイプに parallel は指定できず（入れ子禁止）、子 0 件は定義不正として validate エラーとする。子にも通常プロセスと同じ検証（ディレクトリ名形式・プラグイン解決可否・config/config.yml 存在・接続情報直書き禁止・plugin.yml requires）を適用する。互換境界（ディレクトリ規約・プロセスプラグイン実行契約・エビデンスディレクトリ規約・ジャーナル）は不変とする"
        acceptance_criteria:
          - "Given _{seq}_{group}_parallel 配下に親と同形式の子プロセスディレクトリを配置 When stfw validate を実行する Then 子にも通常プロセスと同じ検証が適用され合格する"
          - "Given 子のタイプに parallel を指定、または子 0 件の parallel プロセス When stfw validate を実行する Then エラーとして検出される"
        affected_models:
          - type: "variation"
            action: "modify"
            target: "プロセスタイプ"
          - type: "information"
            action: "modify"
            target: "プロセス"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "condition"
            action: "modify"
            target: "run 前静的検証"
      - id: "SPEC-027-02"
        specification: "parallel の実行セマンティクスを定める。子プロセス 1 件 = 実行ジャーナル上の 1 ステップとし、steps_enumerated イベントで子ディレクトリ名を昇順に全件 Pending 登録する。process 階層フック（setup / teardown）は親 parallel プロセスで 1 回のみ実行し、子では実行しない。子は seq 昇順に実行キューへ投入されて並走する（完了順は不定）。子同士に Blocked は無く、先行子が Error でも全子を最後まで実行する。親 parallel プロセスのステータスは全子の悪い方（Error > Warn > Success）で集約し、親が Error の場合は既存規則どおり後続の兄弟プロセスを実行せず停止する"
        acceptance_criteria:
          - "Given 複数の子プロセスを持つ parallel プロセス When stfw run を実行する Then 各子が 1 ステップとしてジャーナルに記録され（steps_enumerated は子ディレクトリ名の昇順）、process 階層フックは親で 1 回のみ実行される"
          - "Given 一部の子が Error 終了する parallel プロセス When 実行が完了する Then 他の子は Blocked にならず最後まで実行され、親のステータスは全子の悪い方（Error > Warn > Success）で集約される"
          - "Given 親 parallel プロセスが Error に集約された run When 後続の兄弟プロセスを確認する Then 実行されず停止している（既存規則どおり）"
        affected_models:
          - type: "condition"
            action: "add"
            target: "parallel 子プロセスの並走実行"
          - type: "condition"
            action: "modify"
            target: "逐次実行・エラー時 Blocked"
          - type: "state"
            action: "modify"
            target: "ステップ実行ステータス"
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-027-03"
        specification: "同時実行数の上限 max_parallel を設定チェーン（同梱デフォルト stfw.yml（stfw.process.parallel.max_parallel: 0）→ プロジェクト stfw.yml → プロジェクト config/plugins/process/parallel/config.yml → プロセス config/config.yml、後勝ち）で解決する。0 = 上限なし（全子を同時起動）、正整数 = 同時実行数の上限（超過分は seq 順に待機）、負数・非整数は設定不正として親プロセスを Error にする"
        acceptance_criteria:
          - "Given max_parallel を正整数に設定 When parallel プロセスを実行する Then 同時に実行される子の数が上限以下に制限され、超過分は seq 順に待機する"
          - "Given max_parallel 未設定（既定 0） When parallel プロセスを実行する Then 全子が上限なしに並走する"
          - "Given max_parallel に負数・非整数を設定 When parallel プロセスを実行する Then 設定不正として親プロセスが Error になる"
        affected_models:
          - type: "variation"
            action: "add"
            target: "parallel 同時実行数設定"
          - type: "information"
            action: "modify"
            target: "プロジェクト設定（stfw.yml）"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
      - id: "SPEC-027-04"
        specification: "子の env は親 parallel プロセスの env を複製し、stfw_process_dir / stfw_process_dirname / stfw_process_seq / stfw_process_group / stfw_process_type 等を子の値で上書きする。stfw_process_dir が子ディレクトリを指すため、エビデンスディレクトリ規約は無変更で子ごとに分離される。部分実行（--from / --only）で指定できるのは親 parallel プロセスまでとする（子は指定不可）。spec 往復（stfw scenario reverse / stfw scaffold）は parallel の子プロセス（processes: 入れ子）を扱い可逆とする"
        acceptance_criteria:
          - "Given 子プロセスで収集系プラグインを実行 When エビデンス出力先を確認する Then 各子のプロセスディレクトリ配下の evidence/ に分離して出力される（エビデンスディレクトリ規約は無変更）"
          - "Given parallel の子ノードパスを --from / --only に指定 When stfw run を実行する Then エラーとなり、指定できるのは親 parallel プロセスまでである"
          - "Given parallel を含むシナリオツリー When reverse → scaffold → reverse を実行する Then 子プロセスを含む骨格が完全一致する（可逆）"
        affected_models:
          - type: "condition"
            action: "modify"
            target: "エビデンスディレクトリ規約"
          - type: "condition"
            action: "modify"
            target: "部分実行の指定制約"
          - type: "condition"
            action: "modify"
            target: "spec/doc 往復の可逆性"
          - type: "information"
            action: "modify"
            target: "プラグイン"

  - id: "REQ-028"
    event_id: "20261125_140812_reflect_compare_files_v230"
    created_at: "2026-11-25T14:08:12"
    requirement: "シナリオ作成者が、組込みプロセスタイプ compareRegex により、名前が実行ごとに変わるファイル（出力時刻・連番入りのファイル名）を、ファイル名の正規表現で期待値（expect）と組み合わせて比較検証（Assert）できる。プロセスローカルの起動設定で、真偽項目に false を書いて共通設定の true を無効化し、一覧項目に [] を書いて共通設定の一覧を空にできる"
    reason: "組込み compare は期待値（expect/）と収集エビデンス（actual/）を相対パスの完全一致でファイルを組み合わせるため、名前に出力時刻や連番を含むファイル（例: balance_report_20240102093015.json）は実行のたびに名前が変わり「片側だけにあるファイル」として差分になり比較できない。比較方法をシナリオのディレクトリ名（_{seq}_{group}_compareRegex）だけで読めるよう、compare の設定で動作を切り替えるのではなく別の組込みプロセスタイプとし、v1.8.0 の追加時から compare のファイル組み合わせ方式を維持している。起動設定の補完規則は compare と共通にする（AS-BUILT §4.11・§4.11.1）"
    priority: "should"
    specifications:
      - id: "SPEC-028-01"
        specification: "組込みプロセスタイプ compareRegex（Assert・検証系。ディレクトリ名 _{seq}_{group}_compareRegex）を提供する。比較は外部 OSS compare-files の正規表現指定比較（compare_regex。compare と同じリリース物に含まれる）で行う。ディレクトリ規約は compare と同じとする（expect/ = git 管理・直下に同一 bizdate 内の収集系 process ディレクトリ名・その配下は当該 process の evidence/ 配下と同型、actual/ = evidence 配下の各ファイルへの file-level symlink・gitignore・自動生成、result/ = compare-files の比較結果・gitignore）。compare は引き続き、相対パスが完全一致するファイル同士を組み合わせる"
        acceptance_criteria:
          - "Given _{seq}_{group}_compareRegex のプロセスディレクトリに expect/ と config/compare_target.csv を配置済み When compareRegex プロセスを実行する Then actual/ が compare と同じ規則で evidence への file-level symlink として組み立てられ、compare_regex が実行され、比較結果が result/ へ出力される"
          - "Given 既存の compare プロセスを含むシナリオ When compareRegex を導入した版で実行する Then compare の挙動（相対パスの完全一致による組み合わせ）は変わらない"
        affected_models:
          - type: "variation"
            action: "modify"
            target: "プロセスタイプ"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "information"
            action: "modify"
            target: "期待値（expect）"
          - type: "information"
            action: "modify"
            target: "比較結果"
          - type: "external_system"
            action: "modify"
            target: "compare-files（ファイル比較 OSS）"
          - type: "condition"
            action: "modify"
            target: "エビデンスディレクトリ規約"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-028-02"
        specification: "比較の組み合わせは比較対象設定 config/compare_target.csv（git 管理・必須）に書く。書式は compare-files の比較対象設定ファイルそのまま（CSV・UTF-8。1 行 = 左ディレクトリ（期待値）, 右ディレクトリ（実績値）, ファイル名正規表現。# 始まりはコメント）。左は expect/{収集系 process 名}/…、右は actual/{収集系 process 名}/… を指す（プロセスディレクトリからの相対パス）。探すのは指定ディレクトリの直下だけで、名前順で最初に一致した 1 件を比較する。CSV に書かなかったファイルは比較しない（ディレクトリ比較の「片側だけにあるファイル = 差分」は働かない）"
        acceptance_criteria:
          - "Given expect/{収集系 process 名}/ と evidence に名前の異なる（時刻入りの）ファイルがあり、compare_target.csv に両者に一致するファイル名正規表現を書いた When compareRegex プロセスを実行する Then 正規表現で対応付けた 1 件どうしが比較され、一致なら Success になる"
          - "Given 指定ディレクトリの直下に正規表現に一致するファイルが複数ある When compareRegex プロセスを実行する Then 名前順で最初に一致した 1 件だけが比較される"
          - "Given compare_target.csv に書かれていないファイルが expect/ または evidence にある When compareRegex プロセスを実行する Then そのファイルは比較されず、差分にもならない"
        affected_models:
          - type: "information"
            action: "add"
            target: "比較対象設定（compare_target.csv）"
          - type: "information"
            action: "modify"
            target: "期待値（expect）"
          - type: "condition"
            action: "modify"
            target: "エビデンスディレクトリ規約"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-028-03"
        specification: "比較不一致の扱いは compare と同じ設定キー on_mismatch: error（既定）| warn とする。終了コードの対応付けも compare と同じとする（compare_regex: 0=一致 / 3=差分 / 6=エラー。差分は error で exit 6 に変換してステップ失敗、warn で exit 3 のまま Warn として記録・続行。比較エラーは常に exit 6）。error / warn 以外の値と明示的な空文字は設定不正として exit 6 とし、未定義のときだけ既定の error とする"
        acceptance_criteria:
          - "Given on_mismatch 未設定（既定 error）で比較対象に差分がある When compareRegex プロセスを実行する Then 該当ステップは Error となり後続ステップは Blocked として記録され停止する"
          - "Given on_mismatch: warn で比較対象に差分がある When compareRegex プロセスを実行する Then exit 3 のまま返され、該当ステップは Warn として記録され後続の実行が継続する"
          - "Given on_mismatch に明示的な空文字を設定 When compareRegex プロセスを実行する Then 設定不正として exit 6（Error）になる"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "variation"
            action: "modify"
            target: "compare on_mismatch 設定"
          - type: "condition"
            action: "modify"
            target: "比較不一致はステップ失敗"
      - id: "SPEC-028-04"
        specification: "比較せずに合格するのを防ぐため、次は比較の前後で Error（exit 6）にする: 比較対象設定のデータ行が 0 件、BOM 付き UTF-8、右ディレクトリに expect/ を書く・.. で戻る・process 名が無い、1 行 = 1 レコードにならない書き方（行末でクォートが閉じない、行の途中の CR）、3 列でない行、on_mismatch の明示的な空文字、比較結果（result/）が出ていない、古い actual/・result/ を消せない"
        acceptance_criteria:
          - "Given compare_target.csv のデータ行が 0 件（コメント・空行のみ） When compareRegex プロセスを実行する Then 比較せずに Error（exit 6）になる"
          - "Given compare_target.csv が BOM 付き UTF-8、または 3 列でない行・行末でクォートが閉じない行・行の途中の CR を含む When compareRegex プロセスを実行する Then 比較の前に Error（exit 6）になる"
          - "Given compare_target.csv の右ディレクトリに expect/ を書いた、.. で戻る、または process 名が無い行がある When compareRegex プロセスを実行する Then 比較の前に Error（exit 6）になる"
          - "Given compare_regex が終了コード 0 または 3 を返したが result/ が空 When compareRegex プロセスの終了を判定する Then 比較が行われていないとして Error（exit 6）になる"
          - "Given 前回の actual/ または result/ を削除できない When compareRegex プロセスを実行する Then 古い比較結果を今回の結果として扱わず Error（exit 6）になる"
        affected_models:
          - type: "condition"
            action: "add"
            target: "compareRegex 比較の素通り防止"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-028-05"
        specification: "compareRegex はプロジェクト共通の config/plugins/process/compareRegex/ が存在すれば COMPAREFILES_CLASSPATH の末尾に加え、同ディレクトリの compare_layout/*.json と compare_files.{json,yaml,yml} を読み込める。compare/ の共通ディレクトリは自動追加しない。比較レイアウトは後勝ちでプロセスローカルの config/compare_layout/ を適用する。プロセスローカルの起動設定は config/compare_files.{json,yaml,yml} をこの順で探し、-config で指定する。compare-files v2.3.0 では、既定探索（COMPAREFILES_CLASSPATH → カレント → ./config）で最初に見つかった起動設定 1 件から、SPEC-014-03 の型別規則に従って未記述項目などを補う。ローカルに明示した false と空配列 [] は保持する。プロセスローカルのファイル自身しか見つからず必須キーが欠けていれば Error（exit 6）となる（AS-BUILT §4.11.1 手順 5・6、§4.11 手順 4）。compare-files の同梱版を compare と共有し、stfw:full イメージは compare_files と compare_regex を同梱する（compare と compareRegex の既定の版が食い違うとイメージのビルドを失敗させる）"
        acceptance_criteria:
          - "Given compare と compareRegex の共通ディレクトリに異なる比較ルールがあり、既存の COMPAREFILES_CLASSPATH に compare のディレクトリ指定が無い When compareRegex を実行する Then compareRegex の共通ディレクトリが探索パス末尾に加わり、compare の共通設定は適用されない"
          - "Given v1.8.0 では compareRegex が compare の共通ディレクトリを読み、自身の共通ディレクトリは config.yml 専用だった環境 When v1.9.0 へ更新して compare と同じ比較ルールを使う Then config/plugins/process/compare/ の比較レイアウト・起動設定を config/plugins/process/compareRegex/ に複製する（AS-BUILT §4.11.1 手順 5）"
          - "Given compare と compareRegex の既定の compare_files_version が食い違う When stfw:full イメージをビルドする Then ビルドが失敗する"
          - "Given 既存の COMPAREFILES_CLASSPATH と compareRegex の共通ディレクトリの両方に起動設定があり、ローカルに未記述項目・ignoreFileRegexList: []・sorted: false がある When compare-files v2.3.0 の compareRegex を起動する Then ローカルを -config で使い、未記述項目は最初に見つかった起動設定 1 件の値で補い、ignoreFileRegexList: [] と sorted: false は保持する"
          - "Given 既存の探索先に起動設定が無く、compareRegex の共通ディレクトリとプロセスローカルに設定がある When compareRegex を起動する Then 欠落キーは compareRegex の共通設定の値を引き継ぎ、同じ fileRegexPattern の比較レイアウトはローカルの定義が優先される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "external_system"
            action: "modify"
            target: "compare-files（ファイル比較 OSS）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "condition"
            action: "modify"
            target: "compareRegex の比較ルール解決"
      - id: "SPEC-028-06"
        specification: "compareRegex は自身の永続キャッシュにある compare_regex を優先し、キャッシュが無ければ設定版と同じ stfw:full の同梱版を使う。どちらも利用できない場合は stfw plugin install compareRegex でプロビジョニングする（SPEC-031-02、AS-BUILT §4.11.1）"
        acceptance_criteria:
          - "Given compare_regex が永続キャッシュにも同梱版にも無い環境 When stfw plugin install compareRegex を実行する Then compareRegex 用の永続キャッシュに compare_regex が配置される"
          - "Given 永続キャッシュが無く同梱版と設定版が一致する stfw:full When install せずに compareRegex を実行する Then 同梱版の compare_regex で実行する"
        affected_models:
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "buc"
            action: "modify"
            target: "プロセスプラグイン拡張フロー"
      - id: "SPEC-028-07"
        specification: "resume が引き継いだ evidence/ に過去の時刻入りファイルが残る場合、compareRegex は指定ディレクトリ直下で名前順に最初に一致するファイルを比較するため、前回分が今回分より先に並ぶと古いファイルを選ぶ。対象の収集ステップは、自分が出す時刻入りファイルの前回分を削除してから今回分を書き出す（AS-BUILT §4.11.1）"
        acceptance_criteria:
          - "Given 前回の時刻入りファイルが引き継がれた When 収集ステップが自分の前回分を削除して今回分を書き出す Then compareRegex は今回のファイルを比較する"
        affected_models:
          - type: "condition"
            action: "add"
            target: "resume 時の compareRegex 比較対象の入れ替え"
          - type: "information"
            action: "modify"
            target: "比較対象設定（compare_target.csv）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"

  - id: "REQ-029"
    event_id: "20261125_050658_reflect_run_workspace_resume_bundled_tools"
    created_at: "2026-11-25T05:06:58"
    requirement: "テスト実行者が、同一プロジェクトで同じシナリオを含む複数の run を並走させ、実行ごとの生成物を個別に参照できる"
    reason: "同名のシナリオを並走させても実行時生成物が衝突せず、scenario/ の正本を使って繰り返し実行できるようにするため（AS-BUILT §5.7・§3.4）。この要求の対象は、同一プロジェクト内で別 run の生成物を分離することに限る。複数ユーザーの同時アクセスやスループットのスケールアウトは対象外とし、性能要件と非機能要求グレードは現行水準を前提とする。"
    priority: "must"
    specifications:
      - id: "SPEC-029-01"
        specification: "run_id 採番・ジャーナル作成の直後、run の node_start 前に、実行対象の scenario/{name}/ 全体を .stfw/runs/{run_id}/workspace/{name}/ へ複製する。部分実行でも新しいワークスペースを作る。通常ファイルとディレクトリのパーミッションを保持する（setuid / setgid / sticky を除く）。シンボリックリンクは参照先の実体を複製し、参照切れ・循環、FIFO 等の通常ファイル／ディレクトリ以外はエラーとする。規約上のプロセス位置（bizdate 直下と parallel の子）の直下にある evidence/・actual/・result/ は正本からの複製対象外とし、data/ 等の入力配下の同名ディレクトリは複製する。標準出力に複製前の run_id: に続いて workspace: {絶対パス} を出す。複製または resume のマージに失敗した場合は実行を開始せず exit 6 とし、空ジャーナルの run ディレクトリを可能な限り削除して stderr にログを出す。出力済みの run_id は無効になる"
        acceptance_criteria:
          - "Given 同じシナリオで複数の run を並走 When 複製して実行する Then run ごとの workspace にシナリオがあり、標準出力に run_id とワークスペースの絶対パスが順に出る"
          - "Given 正本に 0600 のファイル・有効なリンク・プロセス直下の予約出力ディレクトリ・data/ 配下の同名ディレクトリがある When 複製する Then 権限を保持してリンクの実体と入力ディレクトリをコピーし、プロセス直下の予約出力はコピーしない"
          - "Given 正本のリンクが参照切れまたは循環 When ワークスペースの複製に失敗する Then run の実行を始めず exit 6 を返し、空ジャーナルの run ディレクトリの削除を試みる"
        affected_models:
          - type: "information"
            action: "add"
            target: "実行ワークスペース"
          - type: "condition"
            action: "add"
            target: "実行ワークスペースの複製"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-029-02"
        specification: "プロセスは複製ツリー上で実行し、evidence/・actual/・result/ 等の実行生成物は run ワークスペースに作る。scenario/ の正本は読み取り元として使い、実行時に書き込まない。階層フックの実体と作業ディレクトリはプロジェクトの plugins/{level}/_common/{phase}/ に置き、stfw_scenario_dir / stfw_bizdate_dir / stfw_process_dir は複製側を指す。同梱プロセスプラグインは .stfw/runs/{run_id}/plugins/process/{type}/ へ展開する。通常プロセスは実行ごとにワイプして再展開し、parallel の子は並走前にタイプごとに 1 回展開する。stfw plugin install の展開先は .stfw/plugins/ とし、プロジェクトの plugins/・config/ と .stfw/cache/plugins/ のプロビジョニング済み資産は並走 run が読み取り共有する"
        acceptance_criteria:
          - "Given 同じシナリオの 2 つの run When 収集・比較プロセスが動く Then 各 run のワークスペース内にだけ出力され、正本と別 run の出力を上書きしない"
          - "Given 階層フックが実行される When 作業ディレクトリと公開 env を確認する Then フックの作業ディレクトリはプロジェクト側で、対象階層のディレクトリ env はワークスペース側を指す"
          - "Given 2 つの run が同じ組込みプラグインを使用 When 通常実行または parallel の子の実行を準備する Then run ごとに展開先が分かれ、parallel の子向けは開始前にタイプごとに一度展開する"
        affected_models:
          - type: "information"
            action: "add"
            target: "実行ワークスペース"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
          - type: "condition"
            action: "modify"
            target: "逐次実行・エラー時 Blocked"
      - id: "SPEC-029-03"
        specification: "ワークスペースは run ディレクトリの一部としてハウスキープ（REQ-019）で生成物ごと削除する。保存が必要なエビデンスは保存期間内に外部へ回収する。並走 run が実行中のワークスペースを削除しないよう、retention_days は想定される最長実行時間より十分長く設定する"
        acceptance_criteria:
          - "Given run の保存期間が過ぎている When ハウスキープが run ディレクトリを削除する Then ワークスペースとそのエビデンスも削除される"
        affected_models:
          - type: "information"
            action: "add"
            target: "実行ワークスペース"
          - type: "condition"
            action: "modify"
            target: "実行結果ハウスキープ"

  - id: "REQ-030"
    event_id: "20261125_050658_reflect_run_workspace_resume_bundled_tools"
    created_at: "2026-11-25T05:06:58"
    requirement: "テスト実行者が、前 run の収集済みエビデンスや実行時生成の入力を引き継ぎ、正本の修正を反映した新しい run で実行を再開できる"
    reason: "長いシナリオの失敗後に、生成済みのエビデンスや入力を再収集せず、失敗箇所の修正を適用して実行をやり直すため（AS-BUILT §5.8）"
    priority: "must"
    specifications:
      - id: "SPEC-030-01"
        specification: "stfw run --resume は SPEC-003-04 の順序で最新の完了済み run を選び、--resume=<run_id>（等号区切り）で引き継ぎ元を明示できる。引き継ぎたい run の後に別の run（例: resume を指定しない部分実行）を挟み、元の run から引き継ぐときは --resume=<run_id> で明示する。run の node_end が記録されていれば Error で完走した run も対象となる。ハウスキープ後・新 run_id 採番前に引き継ぎ元と対象シナリオの存在を検証する。--resume= の空値、完了済み run の不在、明示した run_id が不正・不存在・未完了、または引き継ぎ元ワークスペースに対象シナリオが無い場合は exit 6 とする。部分実行の指定なしでも利用でき、実行対象の全シナリオに適用する"
        acceptance_criteria:
          - "Given より新しい実行中の run と、それ以前に Error で完走した run がある When run_id を省略して --resume する Then 最新の完了済み run が選ばれる"
          - "Given 引き継ぎたい完了済み run の後に別の完了済み run がある When --resume=<run_id> で元の run を指定する Then 明示した run を引き継ぎ元にする"
          - "Given 完了済み run が無い、または指定 run_id が不正・不存在・未完了、または元に対象シナリオが無い When --resume する Then 新 run_id 採番前に exit 6 になる"
        affected_models:
          - type: "condition"
            action: "add"
            target: "resume の引き継ぎ元とマージ"
          - type: "variation"
            action: "add"
            target: "引き継ぎ元指定（resume）"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-030-02"
        specification: "正本を新 run のワークスペースに複製した後、前 run の同一シナリオツリーから新しい複製に存在しない項目をマージする。同一パスは正本の複製を優先し、ファイルとディレクトリの種別が異なる場合も正本側を優先する。前 run のみに存在する evidence/・actual/・result/・実行時生成の data/ 等を引き継ぎ、正本から削除したファイルも前 run 側に残っていれば引き継ぐ。再実行した収集ステップは出力を上書きし得る。compareRegex 向けの時刻入りファイルの扱いは SPEC-028-07 を参照する"
        acceptance_criteria:
          - "Given 正本と元のワークスペースに同一パスのファイルがあり正本を修正済み When resume する Then 正本の修正版を実行し、前 run のみにあるエビデンス・実行時生成の入力を使える"
          - "Given 正本と前 run で同一パスの種別が異なり、別の正本ファイルは削除済みで前 run にだけ残っている When resume する Then 同一パスは正本の種別を採用し、前 run にだけ残ったファイルは引き継ぐ"
        affected_models:
          - type: "information"
            action: "add"
            target: "実行ワークスペース"
          - type: "condition"
            action: "add"
            target: "resume の引き継ぎ元とマージ"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"
      - id: "SPEC-030-03"
        specification: "resume は新しい run_id の別実行として記録し、run の node_start の attrs に resume_from（引き継ぎ元 run_id）を記録する。標準出力では workspace: の直後に resume_from: {run_id} を出す"
        acceptance_criteria:
          - "Given 完了済み run を引き継ぐ When 新 run を開始する Then 新ジャーナルの run の node_start と標準出力の workspace: の次の行に引き継ぎ元 run_id が記録される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "実行ジャーナル（journal.jsonl）"
          - type: "information"
            action: "modify"
            target: "実行（run）"
          - type: "buc"
            action: "modify"
            target: "シナリオ一括自動実行フロー"

  - id: "REQ-031"
    event_id: "20261125_140812_reflect_compare_files_v230"
    created_at: "2026-11-25T14:08:12"
    requirement: "環境管理者・テスト実行者が、stfw:full の対応ツールを用いて、プラグイン実行環境で外部ツールを事前取得せずに組込みプラグインを実行できる"
    reason: "必要な外部ツールがイメージに入っていれば、プラグイン実行環境から配布元に接続できない場合にも既定の構成で実行できるため（AS-BUILT §4.8・§10.2）"
    priority: "must"
    specifications:
      - id: "SPEC-031-01"
        specification: "stfw:full は全組込みプラグインのランタイム依存を含む。通常版から継承する依存に加え、sshpass、MariaDB と PostgreSQL のクライアント（mysql / mysqldump / psql）、Valkey の redis-cli、Chrome for Testing の chrome-headless-shell と必要なライブラリ・フォントを同梱する。stfw:full は k6（invokeRest / invokeWeb）、compare-files（compare / compareRegex）、logfilter（collectLog）を /opt/stfw/bundled/{tool}/{os_arch}/ に同梱し、stfw_plugin_bundled_dir=/opt/stfw/bundled を ENV で公開する。ビルド時にプラグインの bin/install/install で取得し、版と logfilter の対象 arch は各プラグインの既定 config.yml を正として {tool}/VERSION に版を記録する。現在の既定は k6 v2.4.0、compare-files v2.3.0、logfilter v2.1.0。k6 と compare-files はイメージの arch 用で、compare-files は compare_files と compare_regex を含む。logfilter は logfilter_arches の全 arch を含む。invokeRest / invokeWeb 間の k6_version、または compare / compareRegex 間の compare_files_version が食い違う場合はビルドを失敗させる"
        acceptance_criteria:
          - "Given 各プラグインの既定版で stfw:full をビルド When イメージを確認する Then DB クライアント・sshpass・redis-cli・chrome-headless-shell を利用でき、ENV が /opt/stfw/bundled を指し、各ツールの VERSION、イメージ向けの k6・compare_files・compare_regex、指定 arch 全ての logfilter が存在する。compare-files の共有 VERSION は v2.3.0、logfilter の VERSION は v2.1.0 である"
          - "Given 同梱版を共有する 2 プラグインの既定版が異なる When stfw:full をビルドする Then ビルドが失敗する"
        affected_models:
          - type: "variation"
            action: "modify"
            target: "Docker イメージ構成"
          - type: "information"
            action: "modify"
            target: "Process / Plugin 設定（config.yml）"
          - type: "information"
            action: "modify"
            target: "プラグイン"
          - type: "external_system"
            action: "modify"
            target: "grafana k6"
          - type: "external_system"
            action: "modify"
            target: "compare-files（ファイル比較 OSS）"
          - type: "external_system"
            action: "modify"
            target: "logfilter（ログ収集 OSS）"
      - id: "SPEC-031-02"
        specification: "対象プラグインの is_installed と bin/run/execute は永続キャッシュ → VERSION が設定と一致する同梱版 → 未プロビジョニングの順で外部ツールを解決する。stfw は stfw_plugin_bundled_dir を設定せず、OS 環境変数としてプラグインへ継承する。未設定のホスト実行や通常版イメージでは、永続キャッシュを使い、キャッシュも無ければ従来どおり未プロビジョニングとなる（AS-BUILT §4.5・§4.8）。collectLog は必要な arch ごとに解決する。版（k6_version / compare_files_version / logfilter_version）や logfilter_arches は、plugin.yml の provision_keys に従いプラグイン既定 → プロジェクト共通 config/plugins/process/{type}/config.yml の設定で決める。install と実行時の is_installed / execute は同じ設定値を使う（SPEC-016-04・SPEC-022-01、AS-BUILT §4.7・§4.8）。キャッシュが無く同梱版が使えるとき、stfw plugin install はインストール済み（exit 3）、stfw init は already provisioned としてダウンロードを省略する。キャッシュが無く設定版が同梱版と異なる場合、実行前の is_installed は stderr に原因と設定・install の対処を示し、実行は exit 6 となる。同梱で補えない arch は install が必要となる"
        acceptance_criteria:
          - "Given 必要な永続キャッシュが無く同梱バイナリと設定版が揃う When インストールや取得元ネットワークなしで実行する Then 対象プラグインは同梱版で実行できる"
          - "Given 永続キャッシュと版一致の同梱版がある When is_installed や execute がツールを解決する Then 永続キャッシュを優先する"
          - "Given キャッシュが無くプロジェクト共通設定で同梱版と異なる版を指定 When 対象プラグインを実行する Then 同梱版を選ばず、原因と対処を stderr に出して exit 6 になる"
          - "Given collectLog が複数種の arch を要求する When 永続キャッシュに一部の arch だけが存在する Then 残りを版一致の同梱版で補い、同梱にも無い arch は install を要する"
          - "Given 版一致の同梱版でプロビジョニング済みと判定できる When stfw plugin install または stfw init を実行する Then install は exit 3、init は already provisioned としてダウンロードしない"
          - "Given stfw_plugin_bundled_dir が未設定の環境 When is_installed や execute がツールを解決する Then 永続キャッシュを使い、キャッシュが無い場合は未プロビジョニングとして扱う"
          - "Given 同梱版とプロジェクト共通の設定版が一致し、プロセスローカルに別の版を指定している When install の配備判定とプロセス実行を行う Then 両者はプロジェクト共通の版で判定し、キャッシュが無ければ版一致の同梱版を利用できる"
