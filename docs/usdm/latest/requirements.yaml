        specification: "期限切れ run の .stfw/reports/runs/{run_id}.html もハウスキープで削除する（レポート不在は許容）。削除が 1 件でもあればレポート index を再生成し、削除済みの run が一覧に残らないようにする（AS-BUILT §5.6）"
