          - type: "state"
            action: "delete"
            target: "server 稼働状態"
          - type: "information"
            action: "delete"
            target: "サーバプロセス"
          - type: "information"
            action: "delete"
            target: "状態 DB（digdag DB）"
          - type: "variation"
            action: "delete"
            target: "DB モード"
          - type: "condition"
            action: "delete"
            target: "server 多重起動禁止"
          - type: "external_system"
            action: "delete"
