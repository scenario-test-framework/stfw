    requirement: "テスト実行者が、stfw run の開始時に、保存期間を過ぎた過去の実行結果（実行ジャーナル、実行ワークスペースとその生成物、HTML レポート）を自動削除でき、継続利用でストレージが逼迫するのを防げる"
    reason: "run ごとに実行ディレクトリ（ジャーナル・ワークスペース内のエビデンス等）と HTML レポートが累積する。run の開始時にハウスキープを実行すれば、専用サブコマンドや常駐ジョブを使わずに保存期間を維持できる"
    priority: "should"
    specifications:
      - id: "SPEC-019-01"
        specification: "stfw.yml の stfw.housekeep.retention_days で保存日数を指定する。未設定・0 は無期限保存とし、負数・非整数は警告して無効とする。stfw run の検証ゲート通過後・新 run_id 採番前に、run_id の採番時刻（ローカルタイムゾーン）が現在時刻から保存日数を引いた時刻より前の .stfw/runs/{run_id}/ を削除する。対象にはジャーナル・実行ワークスペース・evidence/・actual/・result/ を含む。個別の削除失敗は警告し、残りの処理と本体の実行を続ける（AS-BUILT §5.6〜§5.7）"
        acceptance_criteria:
          - "Given stfw.housekeep.retention_days が設定され run_id の採番時刻が期限を過ぎている When 検証を通過して stfw run を開始する Then 該当 run のディレクトリごとジャーナルとワークスペース内の実行生成物が削除される"
          - "Given 採番時刻とファイル mtime の期限判定が異なる When ハウスキープする Then 採番時刻を基準に削除を判定する"
          - "Given 設定が未設定・0・負数・非整数のいずれか When stfw run を開始する Then 過去 run は削除せず、負数・非整数は警告する"
          - "Given 期限切れ run のうち一部の削除が失敗する When ハウスキープする Then 失敗を警告し、残りの削除と run の実行を続ける"
